      saveStore();
      renderNotebookEditor(body,key);
    };
    pageDiv.appendChild(delBtn);
    scrollInner.appendChild(pageDiv);

    const ctx = canvas.getContext('2d');
    const liveCtx = liveCanvas.getContext('2d');
    pageCtxs[page.id] = {canvas, ctx, liveCanvas, liveCtx, page};
    setupPageDrawing(canvas, ctx, liveCanvas, liveCtx, page, s);
  });

  function sizeAll(){
    Object.values(pageCtxs).forEach(({canvas,ctx,liveCanvas,liveCtx,page})=>{
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const w = rect.width || 700, h = 900;
      [canvas, liveCanvas].forEach(c=>{
        c.width = Math.max(1, Math.round(w*dpr));
        c.height = Math.max(1, Math.round(h*dpr));
        c.style.width = w+'px';
        c.style.height = h+'px';
      });
      if(ctx) ctx.setTransform(dpr,0,0,dpr,0,0);
      if(liveCtx) liveCtx.setTransform(dpr,0,0,dpr,0,0);
      redrawCanvas(canvas, ctx, page);
    });
  }
  sizeAll();
  window.addEventListener('resize', sizeAll, {once:false});

  document.getElementById('nbUndo').onclick=()=>{
    const targetPageId = s.lastActivePageId || (nb.pages[nb.pages.length-1] && nb.pages[nb.pages.length-1].id);
    const target = pageCtxs[targetPageId];
    if(!target || target.page.strokes.length===0) return;
    const stroke = target.page.strokes.pop();
    if(!s.redoStacks[targetPageId]) s.redoStacks[targetPageId]=[];
    s.redoStacks[targetPageId].push(stroke);
    saveStore();
    redrawCanvas(target.canvas, target.ctx, target.page);
  };
  document.getElementById('nbRedo').onclick=()=>{
    const targetPageId = s.lastActivePageId || (nb.pages[nb.pages.length-1] && nb.pages[nb.pages.length-1].id);
    const target = pageCtxs[targetPageId];
    const stack = s.redoStacks[targetPageId];
    if(!target || !stack || stack.length===0) return;
    const stroke = stack.pop();
    target.page.strokes.push(stroke);
    saveStore();
    redrawCanvas(target.canvas, target.ctx, target.page);
  };
  document.getElementById('nbClear').onclick=()=>{
    const targetPageId = s.lastActivePageId || (nb.pages[nb.pages.length-1] && nb.pages[nb.pages.length-1].id);
    const target = pageCtxs[targetPageId];
    if(!target) return;
    if(!confirm('Очистить эту страницу? Все записи на ней исчезнут — это безвозвратно.')) return;
    target.page.strokes = [];
    s.redoStacks[targetPageId] = [];
    saveStore();
    redrawCanvas(target.canvas, target.ctx, target.page);
  };

  function applyZoom(){
    scrollInner.style.transform = `scale(${s.zoom||1})`;
    scrollInner.style.transformOrigin = 'top center';
    document.getElementById('nbZoomLabel').textContent = Math.round((s.zoom||1)*100)+'%';
  }
  document.getElementById('nbZoomIn').onclick=()=>{ s.zoom = Math.min(2.2, (s.zoom||1)+0.1); applyZoom(); };
  document.getElementById('nbZoomOut').onclick=()=>{ s.zoom = Math.max(0.6, (s.zoom||1)-0.1); applyZoom(); };
  document.getElementById('nbZoomReset').onclick=()=>{ s.zoom = 1; applyZoom(); };
  applyZoom();

  /* ---------- Зум щипком двумя пальцами (палец не рисует — он свободен для жестов) ---------- */
  (function initPinchZoom(){
    const active = new Map(); // pointerId -> {x,y}
    let pinchStartDist = null, pinchStartZoom = 1;
    scrollWrap.addEventListener('pointerdown',(e)=>{
      if(e.pointerType!=='touch') return;
      active.set(e.pointerId, {x:e.clientX, y:e.clientY});
      if(active.size===2){
        const pts = [...active.values()];
        pinchStartDist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
        pinchStartZoom = s.zoom||1;
      }
    });
    scrollWrap.addEventListener('pointermove',(e)=>{
      if(e.pointerType!=='touch' || !active.has(e.pointerId)) return;
      const prev = active.get(e.pointerId);
      active.set(e.pointerId, {x:e.clientX, y:e.clientY});
      if(active.size===2 && pinchStartDist){
        e.preventDefault();
        const pts = [...active.values()];
        const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
        s.zoom = Math.min(2.2, Math.max(0.6, pinchStartZoom * (dist/pinchStartDist)));
        applyZoom();
      } else if(active.size===1){
        // один палец — ручной скролл (у канваса touch-action:none, поэтому браузер сам не скроллит)
        e.preventDefault();
        const dy = e.clientY - prev.y;
        scrollWrap.scrollTop -= dy;
      }
    }, {passive:false});
    function releasePointer(e){ active.delete(e.pointerId); if(active.size<2) pinchStartDist=null; }
    scrollWrap.addEventListener('pointerup', releasePointer);
    scrollWrap.addEventListener('pointercancel', releasePointer);
  })();

  function setupPageDrawing(canvas, ctx, liveCanvas, liveCtx, page, s){
    // touch-action:none обязателен — иначе браузер на iPad перехватывает движение
    // стилуса как жест скролла/перелистывания вместо рисования (баг «стилус листает страницы»)
    canvas.style.touchAction = 'none';
    liveCanvas.style.touchAction = 'none';
    let drawing = false;
    let currentStroke = null;
    let holdTimer = null;
    let startPoint = null;
    let activePointerId = null;

    function posFromEvent(e){
      const rect = canvas.getBoundingClientRect();
      const zoom = s.zoom||1;
      return {
        x: (e.clientX-rect.left)/zoom,
        y: (e.clientY-rect.top)/zoom,
        pressure: (e.pressure && e.pressure>0) ? e.pressure : 0.5,
        t: Date.now()
      };
    }
    function clearHoldTimer(){ if(holdTimer){ clearTimeout(holdTimer); holdTimer=null; } }
    function armHoldTimer(){
      clearHoldTimer();
      holdTimer = setTimeout(()=>{
        if(!drawing || !currentStroke || currentStroke.points.length<2) return;
        const last = currentStroke.points[currentStroke.points.length-1];
        currentStroke.straightened = true;
        currentStroke.points = [startPoint, last];
        liveCtx.clearRect(0,0,liveCanvas.width,liveCanvas.height);
        paintSmoothPath(liveCtx, currentStroke.points, currentStroke.width, currentStroke.tool, currentStroke.color);
      }, NB_STRAIGHTEN_DELAY);
    }
    function isAllowedPointer(e){
      // Пишет только стилус (Apple Pencil = pointerType 'pen'); мышь разрешена для теста на компьютере.
      // Палец (touch) не рисует — освобождён для скролла и зума щипком.
      return e.pointerType==='pen' || e.pointerType==='mouse';
    }

    canvas.addEventListener('pointerdown',(e)=>{
      if(!ctx || !isAllowedPointer(e)) return;
      e.preventDefault(); // страхуемся от перехвата жеста браузером (не даём стилусу листать/скроллить)
      drawing = true;
      activePointerId = e.pointerId;
      s.lastActivePageId = page.id;
      s.redoStacks[page.id] = [];
      try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
      const p = posFromEvent(e);
      startPoint = p;
      const isEraser = s.tool==='eraser';
      liveCanvas.style.opacity = isEraser ? 0 : (s.opacity!=null?s.opacity:1);
      liveCtx.setTransform((window.devicePixelRatio||1),0,0,(window.devicePixelRatio||1),0,0);
      liveCtx.clearRect(0,0,liveCanvas.width,liveCanvas.height);
      currentStroke = {
        color: isEraser ? '#000000' : s.color,
        width: isEraser ? 22 : s.width,
        opacity: isEraser ? 1 : s.opacity,
        tool: s.tool,
        points: [p]
      };
      if(isEraser) eraseSegment(ctx, currentStroke);
      else paintSmoothPath(liveCtx, currentStroke.points, currentStroke.width, currentStroke.tool, currentStroke.color);
      armHoldTimer();
    });
    canvas.addEventListener('pointermove',(e)=>{
      if(!drawing || !currentStroke || e.pointerId!==activePointerId) return;
      if(!isAllowedPointer(e)) return;
      e.preventDefault();
      const p = posFromEvent(e);
      const last = currentStroke.points[currentStroke.points.length-1];
      const dist = Math.hypot(p.x-last.x, p.y-last.y);
      if(dist < 0.4) return; // игнорируем дрожание меньше субпикселя
      // интерполяция промежуточных точек при редких событиях (палец/медленная связь), чтобы линия не "полосила"
      const steps = Math.min(8, Math.max(1, Math.round(dist / NB_MIN_POINT_DIST)));
      for(let i=1;i<=steps;i++){
        const t = i/steps;
        currentStroke.points.push({
          x: last.x + (p.x-last.x)*t,
          y: last.y + (p.y-last.y)*t,
          pressure: (last.pressure||0.5) + ((p.pressure||0.5)-(last.pressure||0.5))*t,
          t: p.t
        });
      }
      if(currentStroke.tool==='eraser') eraseSegment(ctx, currentStroke);
      else {
        liveCtx.clearRect(0,0,liveCanvas.width,liveCanvas.height);
        paintSmoothPath(liveCtx, currentStroke.points, currentStroke.width, currentStroke.tool, currentStroke.color);
      }
      if(dist > NB_STRAIGHTEN_MOVE_TOLERANCE) armHoldTimer();
    });
    function endStroke(e){
      if(!drawing || (e && e.pointerId!==activePointerId)) return;
      drawing = false;
      clearHoldTimer();
      liveCtx.clearRect(0,0,liveCanvas.width,liveCanvas.height);
      if(currentStroke && currentStroke.points.length>1){
        page.strokes.push(currentStroke);
        saveStore();
        redrawCanvas(canvas, ctx, page); // авторитетная перерисовка без полос поверх live-слоя
      }
      currentStroke = null;
      activePointerId = null;
    }
    canvas.addEventListener('pointerup', endStroke);
    canvas.addEventListener('pointercancel', endStroke);
    canvas.addEventListener('pointerleave', endStroke);
  }
}

/* ---------- Рисование без полос: константная толщина — единый плавный путь;
   переменная толщина (нажим пера) — по сегментам с квадратичным сглаживанием ---------- */
function pseudoNoise(n){
  const x = Math.sin(n*12.9898)*43758.5453;
  return x - Math.floor(x);
}
/* Карандаш: несколько дрожащих полупрозрачных проходов — имитация зерна графита,
   визуально явно отличается от ровной сплошной линии пера. */
function paintPencilTexture(ctx, pts, baseWidth, color){
  ctx.strokeStyle = color;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  const passes = 3;
  for(let p=0;p<passes;p++){
    const seed = p*97 + 13;
    ctx.globalAlpha = 0.36 + 0.13*p;
    ctx.lineWidth = baseWidth * (0.55 + p*0.22);
    ctx.beginPath();
    for(let i=0;i<pts.length;i++){
      const jx = (pseudoNoise(i+seed) - 0.5) * baseWidth * 0.5;
      const jy = (pseudoNoise(i+seed+50) - 0.5) * baseWidth * 0.5;
      const x = pts[i].x+jx, y = pts[i].y+jy;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function paintSmoothPath(ctx, pts, baseWidth, tool, color){
  if(!ctx || pts.length<2) return;
  if(tool==='pencil' && pts.length>2){
    paintPencilTexture(ctx, pts, baseWidth, color);
    return;
  }
  ctx.strokeStyle = color;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  const constWidth = (tool==='highlighter' || tool==='pencil' || tool==='eraser' || pts.length===2);
  if(constWidth){
    ctx.lineWidth = baseWidth;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for(let i=1;i<pts.length-1;i++){
      const mx=(pts[i].x+pts[i+1].x)/2, my=(pts[i].y+pts[i+1].y)/2;
      ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
    }
    ctx.lineTo(pts[pts.length-1].x, pts[pts.length-1].y);
    ctx.stroke();
  } else {
    for(let i=1;i<pts.length;i++){
      ctx.lineWidth = baseWidth * (0.5 + (pts[i].pressure||0.5));
      ctx.beginPath();
      ctx.moveTo(pts[i-1].x, pts[i-1].y);
      ctx.lineTo(pts[i].x, pts[i].y);
      ctx.stroke();
    }
  }
}
/* Ластик реально стирает пиксели (destination-out) — фон страницы (линейка/клетка) не трогается,
   потому что это CSS-разметка ПОД прозрачным канвасом, а не нарисованные пиксели. */
function eraseSegment(ctx, stroke){
  if(!ctx) return;
  ctx.save();
  ctx.globalCompositeOperation = 'destination-out';
  ctx.globalAlpha = 1;
  paintSmoothPath(ctx, stroke.points, stroke.width, 'eraser', '#000');
  ctx.restore();
}
function redrawCanvas(canvas, ctx, page){
  if(!ctx) return;
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.width/dpr, h = canvas.height/dpr;
  ctx.clearRect(0,0,w,h);
  (page.strokes||[]).forEach(stroke=>{
    const pts = stroke.points;
    if(!pts || pts.length<2) return;
    if(stroke.tool==='eraser'){
      eraseSegment(ctx, stroke);
      return;
    }
    const opacity = stroke.opacity!=null ? stroke.opacity : 1;
    if(opacity>=0.98){
      ctx.save();
      ctx.globalAlpha = 1;
      paintSmoothPath(ctx, pts, stroke.width, stroke.tool, stroke.color);
      ctx.restore();
    } else {
      // офф-скрин буфер: рисуем штрих непрозрачно один раз, затем накладываем целиком —
      // так пересечения самого штриха с собой не дают полосатости
      const off = document.createElement('canvas');
      off.width = canvas.width; off.height = canvas.height;
      const octx = off.getContext('2d');
      if(!octx){ paintSmoothPath(ctx, pts, stroke.width, stroke.tool, stroke.color); return; }
      octx.setTransform(dpr,0,0,dpr,0,0);
      paintSmoothPath(octx, pts, stroke.width, stroke.tool, stroke.color);
      ctx.save();
      ctx.setTransform(1,0,0,1,0,0);
      ctx.globalAlpha = opacity;
      ctx.drawImage(off, 0, 0);
      ctx.restore();
    }
  });
}

/* ---------- Изучение карточек в стиле Quizlet: флип + Знаю/Не знаю/Повторю ещё ---------- */

function startStudySession(catKey, cardIds, startId){
  if(cardIds.length===0) return;
  let ids = cardIds.slice();
  if(startId){ ids = [startId, ...ids.filter(id=>id!==startId)]; }
  STUDY_SESSION = { catKey, queue: shuffle(ids), idx:0, flipped:false, seen:0, knew:0 };
  if(startId){ STUDY_SESSION.queue = [startId, ...shuffle(ids.filter(id=>id!==startId))]; }
  renderStudyModal();
  openOverlay();
}
function renderStudyModal(){
  const s = STUDY_SESSION;
  const modal = document.getElementById('modalBody');
  modal.classList.add('modal-lg');
  if(!s || s.queue.length===0){
    modal.innerHTML = `<h3>Сессия завершена</h3><div class="empty-state">Все карточки пройдены: «Знаю» — ${s?s.knew:0} из ${s?s.seen:0} попыток.</div><div class="modal-actions"><button class="btn btn-primary" id="mCloseStudy">Готово</button></div>`;
    document.getElementById('mCloseStudy').onclick=()=>{ modal.classList.remove('modal-lg'); STUDY_SESSION=null; closeOverlay(); buildAllData(); renderAll(); };
    return;
  }
  const cardId = s.queue[s.idx % s.queue.length];
  const card = findCard(s.catKey, cardId);
  if(!card){ s.queue.splice(s.idx%s.queue.length,1); renderStudyModal(); return; }
  const type = (APP_DATA[s.catKey]||{}).meta ? APP_DATA[s.catKey].meta.type : "custom";
  const {top,sub,body,usage} = renderCardFace(type,card);
  modal.innerHTML = `
    <h3>Изучение — ${esc(getCategoryDisplayName(s.catKey))}</h3>
    <div class="study-progress">Осталось в очереди: ${s.queue.length}</div>
    <div class="study-card-wrap">
      <div class="study-card" id="studyCard">
        <span class="sc-topic">${esc(topicName(s.catKey,getCardTopicId(s.catKey,card)))}</span>
        ${s.flipped
          ? `<div><div class="sc-main">${sub}</div><div class="sc-sub">${body}${usage?`<br><br>Perfect Usage: ${usage}`:''}</div></div>`
          : `<div class="sc-main">${top}</div>`}
        <span class="sc-hint">${s.flipped?'Нажми, чтобы увидеть вопрос':'Нажми, чтобы увидеть ответ'}</span>
      </div>
    </div>
    <div class="study-actions">
      <button class="btn btn-dontknow" id="btnDontKnow">Не знаю</button>
      <button class="btn btn-again" id="btnAgain">Повторю ещё</button>
      <button class="btn btn-know" id="btnKnow">Знаю</button>
    </div>
    <div class="modal-actions"><button class="btn" id="mCloseStudy2">Закрыть сессию</button></div>
  `;
  document.getElementById('studyCard').onclick=()=>{ s.flipped=!s.flipped; renderStudyModal(); };
  document.getElementById('mCloseStudy2').onclick=()=>{ modal.classList.remove('modal-lg'); STUDY_SESSION=null; closeOverlay(); };
  function requeue(){
    const id = s.queue.shift();
    s.queue.push(id);
    s.idx = 0;
    s.flipped = false;
    s.seen++;
    renderStudyModal();
  }
  document.getElementById('btnKnow').onclick=()=>{
    s.queue.shift();
    s.idx = 0; s.flipped=false; s.seen++; s.knew++;
    renderStudyModal();
  };
  document.getElementById('btnDontKnow').onclick=requeue;
  document.getElementById('btnAgain').onclick=requeue;
}

/* ---------- Теория (Feynman): главный вопрос + факты + связи ---------- */
let THEORY_EDIT_STATE = null; // {catKey, materialId} — полноэкранный редактор (не модалка!)

function renderTheory(body,key){
  if(THEORY_EDIT_STATE && THEORY_EDIT_STATE.catKey===key){
    renderTheoryEditor(body,key);
    return;
  }
  const materials = (STORE.materials[key]||[]);
  let html = `<div class="btn-row" style="margin-bottom:10px">
    <button class="btn btn-primary" id="btnAddTheory">Добавить материал</button>
    <button class="btn" id="btnQuickAdd">Быстрое добавление карточек текстом</button>
    <button class="btn" id="btnImportTheory">Импортировать из файла</button>
    <input type="file" id="importTheoryFile" accept="application/json" style="display:none">
  </div>
  <div style="font-size:11.5px;color:var(--text-faint);margin-bottom:16px;line-height:1.6">
    Импорт ждёт JSON вида <code>{"materials":[{"topic","title","mainQuestions","explanation","facts","connections","application"}],"cards":[{"topic","fields":{...}}]}</code> — такой файл готовит Claude в чате из твоей лекции.
  </div>`;
  if(materials.length===0){
    html += `<div class="empty-state">Пока нет конспектов. Открой лекцию, запиши тему и дату, а материал и остальное — по шагам.</div>`;
  } else {
    materials.slice().reverse().forEach(m=>{
      const dateLabel = m.dateEnd && m.dateEnd!==m.dateStart ? `${fmtDate(m.dateStart)} — ${fmtDate(m.dateEnd)}` : fmtDate(m.dateStart||m.date);
      html += `<div class="theory-item">
        <div class="theory-topic">${esc(topicName(key,m.topicId))}</div>
        <div class="theory-title-row"><div class="theory-title">${esc(m.title)}</div><div class="theory-date">${dateLabel}</div></div>
        ${m.keywords&&m.keywords.length?`<div class="theory-keywords">${m.keywords.map(k=>`<span class="kw-chip">${esc(k)}</span>`).join('')}</div>`:''}
        <div class="theory-block"><div class="tb-label">Главные вопросы</div><div class="tb-body">${m.mainQuestions||'<span style="opacity:.5">пока не заполнено</span>'}</div></div>
        <div class="theory-block"><div class="tb-label">Материал лекции</div><div class="tb-body theory-material-preview">${m.materialText||'<span style="opacity:.5">пусто</span>'}</div></div>
        ${m.notes?`<div class="theory-block"><div class="tb-label">Заметки</div><div class="tb-body">${m.notes}</div></div>`:''}
        ${m.explanation?`<div class="theory-block"><div class="tb-label">Выжимка простыми словами</div><div class="tb-body">${m.explanation}</div></div>`:''}
        ${m.facts?`<div class="theory-block"><div class="tb-label">Интересные факты — копнуть глубже</div><div class="tb-body">${m.facts}</div></div>`:''}
        ${m.connections?`<div class="theory-block"><div class="tb-label">Связь с другими темами</div><div class="tb-body">${m.connections}</div></div>`:''}
        ${m.application?`<div class="theory-block"><div class="tb-label">Как использовать</div><div class="tb-body">${m.application}</div></div>`:''}
        <div class="theory-actions">
          <button class="btn btn-primary" data-mkcard="${m.id}">Сделать карточку</button>
          <button class="btn" data-edittheory="${m.id}">Изменить</button>
          <button class="btn" data-deltheory="${m.id}">Удалить</button>
        </div>
      </div>`;
    });
  }
  body.innerHTML = html;
  document.getElementById('btnAddTheory').onclick=()=>{ THEORY_EDIT_STATE={catKey:key, materialId:null}; renderTheory(body,key); };
  document.getElementById('btnQuickAdd').onclick=()=>openQuickAddModal(key);
  document.getElementById('btnImportTheory').onclick=()=>document.getElementById('importTheoryFile').click();
  document.getElementById('importTheoryFile').onchange=(e)=>{
    const file = e.target.files[0];
    if(file) importTheoryJSON(key, file, body);
  };
  body.querySelectorAll('[data-mkcard]').forEach(btn=>btn.onclick=()=>{
    const m = materials.find(x=>x.id===btn.dataset.mkcard);
    if(m) openCardModal(key, null, m);
  });
  body.querySelectorAll('[data-edittheory]').forEach(btn=>btn.onclick=()=>{ THEORY_EDIT_STATE={catKey:key, materialId:btn.dataset.edittheory}; renderTheory(body,key); });
  body.querySelectorAll('[data-deltheory]').forEach(btn=>btn.onclick=()=>{
    if(!confirm('Точно удалить материал лекции? Это безвозвратно.')) return;
    STORE.materials[key] = (STORE.materials[key]||[]).filter(x=>x.id!==btn.dataset.deltheory);
    saveStore(); renderTheory(body,key);
  });
}

/* ---------- Полноэкранный редактор материала лекции («как новый файл в Ворде») ---------- */
function extractKeywordsFromHtml(html){
  if(!html) return [];
  const div = document.createElement('div');
  div.innerHTML = html;
  const found = [];
  div.querySelectorAll('b,strong').forEach(el=>{
    const t = el.textContent.trim();
    if(t && t.length<60 && !found.includes(t)) found.push(t);
  });
  return found;
}

function renderTheoryEditor(body, key){
  const editing = THEORY_EDIT_STATE.materialId ? (STORE.materials[key]||[]).find(m=>m.id===THEORY_EDIT_STATE.materialId) : null;
  const topics = getCategoryTopics(key);
  const draft = editing || { title:'', dateStart:todayISO(), dateEnd:'', topicId:'general', mainQuestions:'', keywords:[], materialText:'', notes:'', explanation:'', facts:'', connections:'', application:'' };

  let topicSelect = `<select id="theoryTopicSelect">`;
  topics.forEach(t=>{ topicSelect += `<option value="${t.id}" ${draft.topicId===t.id?'selected':''}>${esc(t.name)}</option>`; });
  topicSelect += `</select>`;

  body.innerHTML = `
    <div class="theory-editor">
      <div class="te-header">
        <input id="theTitle" class="te-title-input" placeholder="Тема лекции" value="${esc(draft.title)}">
        <div class="te-meta-row">
          <label>Тема курса: ${topicSelect}</label>
          <label>Дата: <input type="date" id="theDateStart" value="${draft.dateStart||todayISO()}"></label>

        </div>
      </div>

      <div class="te-section">
        <div class="te-section-title">2 · Главные вопросы и ключевые слова</div>
        <div class="field"><label>Главные вопросы (можно заполнить после лекции)</label><textarea id="theQuestions" placeholder="На какие вопросы отвечает лекция? Можно списком.">${stripHtml(draft.mainQuestions||'')}</textarea></div>
        <div class="field"><label>Ключевые слова — берутся из <b>жирного</b> текста материала ниже, можно править</label>
          <div class="kw-editor" id="kwEditor"></div>
          <input id="kwAddInput" placeholder="Добавить своё ключевое слово и нажать Enter">
        </div>
      </div>

      <div class="te-section">
        <div class="te-section-title">3 · Материал лекции</div>
        ${richFieldFull('theMaterial','Текст лекции — выделяй жирным или маркером то, что должно стать ключевыми словами и карточками', draft.materialText, true)}
        ${richFieldFull('theNotes','Заметки и идеи по ходу лекции', draft.notes, false)}
      </div>

      <div class="te-section te-section-later">
        <div class="te-section-title">4 · Осмысление — заполняется вручную или через ИИ после лекции</div>
        ${richFieldFull('theExplain','Выжимка простыми словами', draft.explanation, false)}
        ${richFieldFull('theFacts','Интересные факты — копнуть глубже', draft.facts, false)}
        ${richFieldFull('theConn','Связь с другими темами', draft.connections, false)}
        ${richFieldFull('theApp','Как и где использовать', draft.application, false)}
      </div>

      <div class="te-ai-row">
        <button class="btn" id="btnCopyForAi">Скопировать для ИИ</button>
        <button class="btn" id="btnImportAi">Вставить обработку от ИИ</button>
        <span class="te-ai-hint">Скопируй, вставь в чат с Claude, попроси обработать по шаблону PRIMUS. — получишь готовый JSON для вставки обратно</span>
      </div>

      <div class="te-footer">
        <button class="btn" id="teCancel">Отмена</button>
        <button class="btn btn-primary" id="teSave">Сохранить материал</button>
      </div>
    </div>
  `;
  wireRichToolbars();

  let keywords = (draft.keywords||[]).slice();
  function drawKeywords(){
    document.getElementById('kwEditor').innerHTML = keywords.map((k,i)=>`<span class="kw-chip editable">${esc(k)}<button data-kwdel="${i}">✕</button></span>`).join('') || '<span style="font-size:11.5px;color:var(--text-faint)">Пока нет — начни выделять текст жирным ниже</span>';
    document.querySelectorAll('[data-kwdel]').forEach(btn=>btn.onclick=()=>{ keywords.splice(+btn.dataset.kwdel,1); drawKeywords(); });
  }
  drawKeywords();
  document.getElementById('kwAddInput').addEventListener('keydown',(e)=>{
    if(e.key==='Enter'){
      e.preventDefault();
      const v = e.target.value.trim();
      if(v && !keywords.includes(v)) keywords.push(v);
      e.target.value='';
      drawKeywords();
    }
  });
  // автообновление ключевых слов при вводе жирного текста в материале
  document.getElementById('theMaterial').addEventListener('blur',()=>{
    const found = extractKeywordsFromHtml(document.getElementById('theMaterial').innerHTML);
    found.forEach(k=>{ if(!keywords.includes(k)) keywords.push(k); });

      connections: document.getElementById('theConn').innerHTML.trim(),
      application: document.getElementById('theApp').innerHTML.trim(),
      date: draft.dateStart || todayISO()

    if(editing){ Object.assign(editing, vals); }
    else { STORE.materials[key].push(Object.assign({id:uid('mat')}, vals)); }
    saveStore();
    THEORY_EDIT_STATE=null;
    renderTheory(body,key);

  document.getElementById('btnCopyForAi').onclick=()=>{
    const text = buildTheoryAiExport(key, {
      title: document.getElementById('theTitle').value.trim(),
      dateStart: document.getElementById('theDateStart').value,
      dateEnd: document.getElementById('theDateEnd').value,
      mainQuestions: document.getElementById('theQuestions').value.trim(),
      keywords,
      materialText: document.getElementById('theMaterial').innerHTML,
      notes: document.getElementById('theNotes').innerHTML
    });
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>openInfoModal('Скопировано','Текст лекции скопирован — вставь его в чат с Claude.'))
        .catch(()=>showCopyFallback(text));
    } else showCopyFallback(text);
  };
  document.getElementById('btnImportAi').onclick=()=>openTheoryAiImportModal(key, body);
}

function showCopyFallback(text){
  document.getElementById('modalBody').innerHTML = `<h3>Скопируй вручную</h3><textarea style="min-height:260px;width:100%" readonly>${esc(text)}</textarea><div class="modal-actions"><button class="btn btn-primary" id="mCloseCopy">Готово</button></div>`;
  document.getElementById('mCloseCopy').onclick=closeOverlay;
  openOverlay();
}
function buildTheoryAiExport(key, d){
  const catName = APP_DATA[key] ? APP_DATA[key].meta.name : key;
  const dateStr = d.dateEnd && d.dateEnd!==d.dateStart ? `${d.dateStart} — ${d.dateEnd}` : d.dateStart;
  return `ПРЕДМЕТ: ${catName}
ТЕМА: ${d.title}
ДАТА: ${dateStr}

ГЛАВНЫЕ ВОПРОСЫ (черновик):
${d.mainQuestions||'(не заполнено)'}

КЛЮЧЕВЫЕ СЛОВА: ${d.keywords.join(', ')||'(пока нет)'}

ТЕКСТ ЛЕКЦИИ:
${stripHtml(d.materialText)}

ЗАМЕТКИ:
${stripHtml(d.notes)}

---
Обработай это по шаблону PRIMUS. и верни JSON вида:
{"mainQuestions":"...", "keywords":["...","..."], "explanation":"...", "facts":"...", "connections":"...", "application":"...", "cards":[{"topic":"${'название темы'}", "fields":{...}}]}`;
}
function openTheoryAiImportModal(key, body){
  document.getElementById('modalBody').innerHTML = `
    <h3>Вставить обработку от ИИ</h3>
    <div class="field"><textarea id="aiJson" style="min-height:200px" placeholder="Вставь сюда JSON, который тебе вернул Claude"></textarea></div>
    <div class="modal-actions"><button class="btn" id="mCancelAi">Отмена</button><button class="btn btn-primary" id="mSaveAi">Применить</button></div>
  `;
  document.getElementById('mCancelAi').onclick=closeOverlay;
  document.getElementById('mSaveAi').onclick=()=>{
    let parsed;
    try{ parsed = JSON.parse(document.getElementById('aiJson').value); }
    catch(e){ openInfoModal('Ошибка','Не удалось прочитать JSON — проверь формат.'); return; }
    if(parsed.mainQuestions) document.getElementById('theQuestions').value = stripHtml(parsed.mainQuestions);
    if(parsed.explanation) document.getElementById('theExplain').innerHTML = parsed.explanation;
    if(parsed.facts) document.getElementById('theFacts').innerHTML = parsed.facts;
    if(parsed.connections) document.getElementById('theConn').innerHTML = parsed.connections;
    if(parsed.application) document.getElementById('theApp').innerHTML = parsed.application;
    if(Array.isArray(parsed.keywords)){
      const kwEditor = document.getElementById('kwEditor');
      if(kwEditor){
        parsed.keywords.forEach(k=>{ if(k) kwEditor.insertAdjacentHTML('beforeend', `<span class="kw-chip">${esc(k)}</span>`); });
      }
    }
    let cardCount = 0;
    if(Array.isArray(parsed.cards) && parsed.cards.length){
      const data = APP_DATA[key];
      const isCustom = !CATEGORY_META.find(m=>m.key===key);
      const fieldKeys = (data.meta.fields || (data.meta.type==='custom'?['front','back','note']:['front','back']));
      parsed.cards.forEach(c=>{
        const topicId = resolveTopicByName(key, c.topic);
        const vals = {};
        fieldKeys.forEach(f=>{ vals[f] = (c.fields && c.fields[f]) || ''; });
        const id = uid(key);
        const newCard = Object.assign({id, catKey:key, level:0, next_review:todayISO(), topicId}, vals);
        if(isCustom){ if(!STORE.customCards[key]) STORE.customCards[key]=[]; STORE.customCards[key].push(newCard); }
        else { if(!STORE.extraCards[key]) STORE.extraCards[key]=[]; STORE.extraCards[key].push(newCard); }
        cardCount++;
      });
      saveStore();
      buildAllData();
    }
    closeOverlay();
    openInfoModal('Готово', `Поля заполнены${cardCount?`, создано карточек: <b>${cardCount}</b>`:''}. Не забудь нажать «Сохранить материал».`);
  };
  openOverlay();
}

/* ---------- Практика: 5 режимов ---------- */
const PRACTICE_MODES = [
  {id:"task", label:"Задачи"},
  {id:"case", label:"Кейсы"},
  {id:"match", label:"Соответствие"},
  {id:"fill", label:"Вставка слова"},
  {id:"open", label:"Открытый вопрос"}
];
function renderPractice(body,key){
  const data = APP_DATA[key];
  if(PRACTICE_STATE.cat!==key){
    PRACTICE_STATE = { cat:key, mode:"task", idx:0, correct:0, total:0, olympiadOnly:false, revealed:false, matchLeft:null, matchDone:[] };
  }
  const modeCounts = {};
  PRACTICE_MODES.forEach(m=>{ modeCounts[m.id] = data.tasks.filter(t=>t.mode===m.id).length; });

  let tabsHtml = '<div class="mode-tabs">';
  PRACTICE_MODES.forEach(m=>{
    tabsHtml += `<button class="mode-tab ${PRACTICE_STATE.mode===m.id?'active':''}" data-mode="${m.id}">${m.label} <span class="mode-count">${modeCounts[m.id]}</span></button>`;
  });
  tabsHtml += '</div>';

  const pool = data.tasks.filter(t=>t.mode===PRACTICE_STATE.mode && (!PRACTICE_STATE.olympiadOnly || t.olympiad));
  const pct = PRACTICE_STATE.total ? Math.round(100*PRACTICE_STATE.correct/PRACTICE_STATE.total) : 0;

  body.innerHTML = `
    <div class="practice-wrap">
      ${tabsHtml}
      <div class="btn-row" style="margin-bottom:10px"><button class="btn" id="btnAddTasks">Добавить задания по теме</button></div>
      <div class="stat-row">
        <div class="stat-box"><div class="num">${PRACTICE_STATE.total}</div><div class="lbl">пройдено</div></div>
        <div class="stat-box"><div class="num">${pct}%</div><div class="lbl">правильных</div></div>
        <div class="stat-box"><div class="num">${pool.length}</div><div class="lbl">доступно в этом режиме</div></div>
      </div>
      <div class="toggle-row"><button class="switch ${PRACTICE_STATE.olympiadOnly?'on':''}" id="olympSwitch"></button> Олимпиадный уровень</div>
      <div class="task-card" id="taskCard"></div>
    </div>
  `;
  document.getElementById('btnAddTasks').onclick=()=>openAddTasksModal(key,body);
  body.querySelectorAll('.mode-tab').forEach(tab=>tab.onclick=()=>{
    PRACTICE_STATE.mode = tab.dataset.mode; PRACTICE_STATE.idx=0; PRACTICE_STATE.revealed=false; PRACTICE_STATE.matchLeft=null; PRACTICE_STATE.matchDone=[];
    renderPractice(body,key);
  });
  document.getElementById("olympSwitch").onclick=()=>{
    PRACTICE_STATE.olympiadOnly=!PRACTICE_STATE.olympiadOnly; PRACTICE_STATE.idx=0; renderPractice(body,key);
  };

  if(pool.length===0){
    document.getElementById("taskCard").innerHTML = `<div class="empty-state">В этом режиме пока нет заданий для темы «${esc(data.meta.name)}».</div>`;
    return;
  }
  const task = pool[PRACTICE_STATE.idx % pool.length];
  renderTaskCard(document.getElementById("taskCard"), task, key, pool, body);
}

function openAddTasksModal(key, body){
  document.getElementById('modalBody').innerHTML = `
    <h3>Добавить задания по теме</h3>
    <div style="font-size:11.5px;color:var(--text-faint);margin-bottom:12px;line-height:1.6">
      Вставь сюда практику, оформленную Claude в чате из твоего материала, в формате JSON-массива:<br>
      <code>[{"topic":"Название темы","mode":"task","prompt":"...","options":["...","...","...","..."],"answer":"...","explanation":"..."}]</code><br>
      Режимы: task, case, fill, open (нужны prompt/answer/explanation), match (вместо этого — "pairs":[{"left":"...","right":"..."}]).
    </div>
    <div class="field"><textarea id="tasksJson" style="min-height:180px" placeholder="Вставь готовый JSON сюда"></textarea></div>
    <div class="modal-actions"><button class="btn" id="mCancelTasks">Отмена</button><button class="btn btn-primary" id="mSaveTasks">Добавить</button></div>
  `;
  document.getElementById('mCancelTasks').onclick=closeOverlay;
  document.getElementById('mSaveTasks').onclick=()=>{
    let parsed;
    try{ parsed = JSON.parse(document.getElementById('tasksJson').value); }
    catch(e){ openInfoModal('Ошибка', 'Не получилось прочитать JSON — проверь, что скобки и кавычки на месте.'); return; }
    if(!Array.isArray(parsed)){ openInfoModal('Ошибка', 'Ожидается массив заданий в квадратных скобках — [ ... ].'); return; }
    if(!STORE.customTasks[key]) STORE.customTasks[key]=[];
    let count = 0;
    parsed.forEach(t=>{
      const topicId = resolveTopicByName(key, t.topic);
      STORE.customTasks[key].push({
        id: uid('ct'), topicId, mode: t.mode||'task',
        prompt: t.prompt||'', options: t.options||null, pairs: t.pairs||null,
        answer: t.answer||'', explanation: t.explanation||'', olympiad: !!t.olympiad
      });
      count++;
    });
    saveStore();
    buildAllData();
    closeOverlay();
    renderAll();
    openInfoModal('Готово', `Добавлено заданий: <b>${count}</b>.`);
  };
  openOverlay();
}

function gradeAndAdvance(key, task, correct){
  PRACTICE_STATE.total++;
  if(correct) PRACTICE_STATE.correct++;
  const card = findCard(key, task.cardId);
  if(card) review(card, correct);
  saveStore();
}

function renderTaskCard(el, task, key, pool, body){
  const modeLabels = {task:"Задача",case:"Кейс",match:"Соответствие",fill:"Вставка слова",open:"Открытый вопрос"};
  let html = `<div class="task-type">${modeLabels[task.mode]}${task.olympiad?' <span class="olympiad-tag">Олимпиадный уровень</span>':''}</div>`;

  if(task.mode==="match"){
    renderMatchTask(el, task, key, body);
    return;
  }

  html += `<div class="task-prompt">${esc(task.prompt)}</div>`;
  if(task.options){
    html += '<div class="opt-list">';
    task.options.forEach(o=>{ html+=`<div class="opt" data-opt="${encodeURIComponent(o)}">${esc(o)}</div>`; });
    html += '</div>';
  } else if(task.mode==="open"){
    html += `<textarea class="open-answer" id="openAnswer" placeholder="Напиши свой ответ своими словами..."></textarea>
              <button class="btn" id="btnReveal">Показать ответ</button>`;
  } else {
    html += `<button class="btn" id="btnReveal">Показать ответ</button>`;
  }
  html += `<div class="answer-box" id="answerBox"><div class="a-label">Пояснение</div><div>${esc(task.explanation)}</div></div>`;
  html += `<div class="grade-row" id="gradeRow" style="display:none">
      <button class="btn btn-good" id="btnGood">Я ответил(а) правильно</button>
      <button class="btn btn-bad" id="btnBad">Я ошибся(лась)</button>
    </div>`;
  html += `<div class="task-footer"><span></span><button class="btn" id="btnNext">Следующее задание</button></div>`;
  el.innerHTML = html;

  if(task.options){
    el.querySelectorAll('.opt').forEach(optEl=>{
      optEl.onclick=()=>{
        if(PRACTICE_STATE.revealed) return;
        PRACTICE_STATE.revealed = true;
        const chosen = decodeURIComponent(optEl.dataset.opt);
        el.querySelectorAll('.opt').forEach(o=>{
          const val = decodeURIComponent(o.dataset.opt);
          if(val===task.answer) o.classList.add('correct');
          else if(val===chosen) o.classList.add('wrong');
        });
        document.getElementById('answerBox').classList.add('show');
        gradeAndAdvance(key, task, chosen===task.answer);
      };
    });
  } else {
    document.getElementById('btnReveal').onclick=()=>{
      document.getElementById('answerBox').classList.add('show');
      document.getElementById('gradeRow').style.display='flex';
      document.getElementById('btnReveal').style.display='none';
    };
    document.getElementById('btnGood').onclick=()=>{ if(!PRACTICE_STATE.revealed){PRACTICE_STATE.revealed=true; gradeAndAdvance(key,task,true);} document.getElementById('gradeRow').style.display='none'; };
    document.getElementById('btnBad').onclick=()=>{ if(!PRACTICE_STATE.revealed){PRACTICE_STATE.revealed=true; gradeAndAdvance(key,task,false);} document.getElementById('gradeRow').style.display='none'; };
  }

  document.getElementById('btnNext').onclick=()=>{
    PRACTICE_STATE.idx++; PRACTICE_STATE.revealed=false;
    renderPractice(body, key);
  };
}

function renderMatchTask(el, task, key, body){
  const leftItems = shuffle(task.pairs.map((p,i)=>({...p, idx:i})));
  const rightItems = shuffle(task.pairs.map((p,i)=>({...p, idx:i})));
  let html = `<div class="task-prompt">${esc(task.prompt)}</div>
    <div class="match-grid">
      <div class="match-col" id="matchLeft">${leftItems.map(p=>`<div class="match-item" data-idx="${p.idx}">${esc(p.left)}</div>`).join('')}</div>
      <div class="match-col" id="matchRight">${rightItems.map(p=>`<div class="match-item" data-idx="${p.idx}">${esc(p.right)}</div>`).join('')}</div>
    </div>
    <div class="task-footer"><span id="matchProgress">Найдено пар: 0 из ${task.pairs.length}</span><button class="btn" id="btnNextMatch">Следующее задание</button></div>`;
  el.innerHTML = html;
  PRACTICE_STATE.matchLeft = null;
  PRACTICE_STATE.matchDone = [];

  function selectItem(itemEl, side){
    const idx = +itemEl.dataset.idx;
    if(itemEl.classList.contains('correct')) return;
    if(side==='left'){
      el.querySelectorAll('#matchLeft .match-item').forEach(i=>i.classList.remove('selected'));
      itemEl.classList.add('selected');
      PRACTICE_STATE.matchLeft = idx;
    } else {
      if(PRACTICE_STATE.matchLeft===null) return;
      const isMatch = PRACTICE_STATE.matchLeft===idx;
      const leftEl = el.querySelector(`#matchLeft [data-idx="${PRACTICE_STATE.matchLeft}"]`);
      if(isMatch){
        itemEl.classList.add('correct'); if(leftEl) leftEl.classList.add('correct');
        PRACTICE_STATE.matchDone.push(idx);
        const card = findCard(key, task.pairs[idx].cardId);
        if(card) review(card, true);
        PRACTICE_STATE.total++; PRACTICE_STATE.correct++;
      } else {
        itemEl.classList.add('wrong'); if(leftEl) leftEl.classList.add('wrong');
        setTimeout(()=>{ itemEl.classList.remove('wrong'); if(leftEl) leftEl.classList.remove('wrong'); },500);
        const card = findCard(key, task.pairs[idx].cardId);
        if(card) review(card, false);
        PRACTICE_STATE.total++;
      }
      saveStore();
      PRACTICE_STATE.matchLeft = null;
      el.querySelectorAll('#matchLeft .match-item').forEach(i=>i.classList.remove('selected'));
      const progEl = document.getElementById('matchProgress');
      if(progEl) progEl.textContent = `Найдено пар: ${PRACTICE_STATE.matchDone.length} из ${task.pairs.length}`;
    }
  }
  el.querySelectorAll('#matchLeft .match-item').forEach(i=>i.onclick=()=>selectItem(i,'left'));
  el.querySelectorAll('#matchRight .match-item').forEach(i=>i.onclick=()=>selectItem(i,'right'));
  document.getElementById('btnNextMatch').onclick=()=>{ renderPractice(body,key); };
}

function renderReview(main){
  const due = reviewDueCards();
  main.innerHTML = `<div class="topbar"><div><h2>Spaced Repetition</h2><div class="desc">Карточки, срок повторения которых наступил</div></div>
    <button class="btn btn-primary" id="btnAddToReview">Добавить карточку на повторение</button></div><div id="reviewBody"></div>`;
  document.getElementById('btnAddToReview').onclick=()=>openAddToReviewModal(main);
  const rb = document.getElementById("reviewBody");
  if(due.length===0){ rb.innerHTML = `<div class="empty-state">Все карточки повторены. Загляни завтра!</div>`; return; }

  // группировка по категории+теме
  const groups = {};
  due.forEach(c=>{
    const topicId = getCardTopicId(c.catKey, c);
    const gKey = c.catKey+"::"+topicId;
    if(!groups[gKey]) groups[gKey] = { catKey:c.catKey, topicId, cards:[] };
    groups[gKey].cards.push(c);
  });
  const groupList = Object.values(groups).sort((a,b)=>b.cards.length-a.cards.length);

  let html = `<div class="review-summary">Сегодня на повторение: <b>${due.length} карточек</b></div><div class="review-groups" id="reviewGroups">`;
  groupList.forEach(g=>{
    const catName = APP_DATA[g.catKey] ? APP_DATA[g.catKey].meta.name : g.catKey;
    html += `<div class="review-group" data-g="${esc(g.catKey)}::${esc(g.topicId)}">
      <span class="rg-mark"></span>
      <span class="rg-text"><b>${esc(catName)}</b> (тема: ${esc(topicName(g.catKey,g.topicId))})</span>
      <span class="rg-count">${g.cards.length} карточек</span>
    </div>`;
  });
  html += `</div><button class="btn btn-primary" id="btnStartReview" style="margin-top:16px">Начать повторение</button><div id="reviewSession"></div>`;
  rb.innerHTML = html;

  let activeFilter = null;
  rb.querySelectorAll('.review-group').forEach(g=>g.onclick=()=>{
    rb.querySelectorAll('.review-group').forEach(x=>x.classList.remove('active'));
    if(activeFilter===g.dataset.g){ activeFilter=null; } else { activeFilter=g.dataset.g; g.classList.add('active'); }
  });
  document.getElementById('btnStartReview').onclick=()=>{
    const queue = activeFilter ? due.filter(c=>(c.catKey+"::"+getCardTopicId(c.catKey,c))===activeFilter) : due.slice();
    runReviewSession(document.getElementById('reviewSession'), queue, false);
  };
}

function runReviewSession(container, queue, isRno){
  let idx = 0;
  function showCard(){
    if(idx>=queue.length){ container.innerHTML = `<div class="empty-state">Повторение завершено — молодец!</div>`; return; }
    const c = queue[idx];
    const meta = APP_DATA[c.catKey] ? APP_DATA[c.catKey].meta : null;
    const type = meta ? (meta.type||"custom") : "custom";
    const {top,sub,body,usage} = renderCardFace(type,c);
    container.innerHTML = `
      <div class="stat-row"><div class="stat-box"><div class="num">${idx+1}/${queue.length}</div><div class="lbl">карточек в очереди</div></div></div>
      <div class="task-card">
        <div class="task-type">${meta?esc(meta.name):''} ${isRno?'· WON':''}</div>
        <div class="task-prompt">${top}</div>
        <div style="color:var(--accent-strong);font-weight:600;margin-bottom:8px">${sub}</div>
        <button class="btn" id="btnRevealRev">Показать ответ</button>
        <div class="answer-box" id="answerBoxRev"><div class="a-label">Детали</div><div>${body}</div>${usage?`<div class="fc-usage" style="margin-top:8px">Perfect Usage: ${usage}</div>`:''}</div>
        <div class="grade-row" id="gradeRowRev" style="display:none">
          <button class="btn btn-good" id="btnGoodRev">Помню</button>
          <button class="btn btn-bad" id="btnBadRev">Забыл(а)</button>
        </div>
      </div>`;
    document.getElementById('btnRevealRev').onclick=()=>{
      document.getElementById('answerBoxRev').classList.add('show');
      document.getElementById('gradeRowRev').style.display='flex';
      document.getElementById('btnRevealRev').style.display='none';
    };
    document.getElementById('btnGoodRev').onclick=()=>{ review(c,true,{isRno}); idx++; showCard(); };
    document.getElementById('btnBadRev').onclick=()=>{ review(c,false,{isRno}); idx++; showCard(); };
  }
  showCard();
}

  const mistakeCards = allCards().filter(c=>STORE.mistakeIds.includes(c.id));
  const due = rnoDueCards();
  main.innerHTML = `
    <div class="topbar"><div><h2>WON <span style="font-size:14px;color:var(--text-faint);font-weight:400">(Work On mistakes)</span></h2><div class="desc">Все ошибки из практики попадают сюда и повторяются по интервалам (1 → 3 → 7 → 14 → 30 дней)</div></div></div>

    <div class="stat-row">
      <div class="stat-box"><div class="num">${mistakeCards.length}</div><div class="lbl">в работе сейчас</div></div>
      <div class="stat-box"><div class="num">${due.length}</div><div class="lbl">на сегодня</div></div>
      <div class="stat-box"><div class="num">${STORE.fixedMistakes||0}</div><div class="lbl">исправлено всего</div></div>
    </div>
    <div id="rnoBody"></div>
  `;
  const body = document.getElementById("rnoBody");
  if(mistakeCards.length===0){
    body.innerHTML = `<div class="empty-state">Ошибок пока нет — или все они уже исправлены. Отличная работа!</div>`;
    return;
  }
  if(due.length===0){
    body.innerHTML = `<div class="empty-state">На сегодня в WON ничего не осталось. Всего в работе: ${mistakeCards.length} карточек.</div>`;
    return;
  }
  const groups = {};
  due.forEach(c=>{
    const topicId = getCardTopicId(c.catKey,c);
    const gKey = c.catKey+"::"+topicId;
    if(!groups[gKey]) groups[gKey]={catKey:c.catKey,topicId,cards:[]};
    groups[gKey].cards.push(c);
  });
  let html = `<div class="review-summary">Сегодня в WON: <b>${due.length} карточек</b></div><div class="review-groups">`;
  Object.values(groups).forEach(g=>{
    const catName = APP_DATA[g.catKey] ? APP_DATA[g.catKey].meta.name : g.catKey;
    html += `<div class="review-group"><span class="rg-mark rno-mark"></span><span class="rg-text"><b>${esc(catName)}</b> (тема: ${esc(topicName(g.catKey,g.topicId))})</span><span class="rg-count">${g.cards.length}</span></div>`;
  });
  html += `</div><button class="btn btn-primary" id="btnStartRno" style="margin-top:16px">Начать работу над ошибками</button><div id="rnoSession"></div>`;
  body.innerHTML = html;
  document.getElementById('btnStartRno').onclick=()=>{ runReviewSession(document.getElementById('rnoSession'), due, true); };
}

function openAddToReviewModal(main){
  document.getElementById('modalBody').innerHTML = `
    <h3>Добавить карточку на повторение</h3>
    <div class="field"><input id="artSearch" placeholder="Начни печатать название карточки..." autofocus></div>
    <div id="artResults" style="max-height:320px;overflow-y:auto;"></div>
    <div class="modal-actions"><button class="btn" id="mCancelArt">Закрыть</button></div>
  `;
  document.getElementById('mCancelArt').onclick=closeOverlay;
  const resultsEl = document.getElementById('artResults');
  function draw(query){
    const q = query.trim().toLowerCase();
    if(q.length<2){ resultsEl.innerHTML = '<div class="empty-state" style="padding:20px">Введи хотя бы 2 буквы</div>'; return; }
    const matches = [];
    allCategoryKeys().forEach(key=>{
      const type = APP_DATA[key].meta.type||"custom";
      APP_DATA[key].cards.forEach(c=>{
        const face = renderCardFacePlain(type,c);
        if(face.top.toLowerCase().includes(q) || face.sub.toLowerCase().includes(q)){
          matches.push({key, card:c, face});
        }
      });
    });
    if(matches.length===0){ resultsEl.innerHTML = '<div class="empty-state" style="padding:20px">Ничего не найдено</div>'; return; }
    resultsEl.innerHTML = matches.slice(0,30).map(m=>`<div class="art-row" data-key="${m.key}" data-id="${m.card.id}">
      <span class="art-top">${esc(m.face.top)}</span><span class="art-sub">${esc(m.face.sub)}</span>
      <span class="art-cat">${esc(getCategoryDisplayName(m.key))}</span>
    </div>`).join('');
    resultsEl.querySelectorAll('.art-row').forEach(row=>row.onclick=()=>{
      const card = findCard(row.dataset.key, row.dataset.id);
      if(card){
        STORE.cardProgress[card.id] = { level: card.level||0, next_review: todayISO() };
        saveStore();
        buildAllData();
        closeOverlay();
        renderAll();
        openInfoModal('Добавлено', `«${esc(row.querySelector('.art-top').textContent)}» теперь в списке на повторение сегодня.`);
      }
    });
  }
  document.getElementById('artSearch').addEventListener('input',(e)=>draw(e.target.value));
  openOverlay();
}

          : 'Скрыть этот предмет из списка? Данные сохранятся, его можно будет вернуть здесь же.';

/* ---------- Общий помощник: rich-text поле (жирный/курсив/зачёркнутый/подчёркнутый) ---------- */
function richField(id, label, html, placeholder){
  return `<div class="field">
    <label>${esc(label)}</label>
    <div class="rt-toolbar" data-for="${id}">
      <button type="button" class="rt-btn b" data-cmd="bold" title="Жирный">B</button>
      <button type="button" class="rt-btn i" data-cmd="italic" title="Курсив">I</button>
      <button type="button" class="rt-btn s" data-cmd="strikeThrough" title="Зачёркнутый">S</button>
      <button type="button" class="rt-btn u" data-cmd="underline" title="Подчёркнутый">U</button>
    </div>
    <div class="rt-editable" contenteditable="true" id="${id}" data-f="${id}" data-placeholder="${esc(placeholder||'')}">${html||''}</div>
  </div>`;
}
function wireRichToolbars(){
  document.querySelectorAll('.rt-toolbar .rt-btn').forEach(btn=>{
    btn.addEventListener('mousedown',(e)=>e.preventDefault());
    btn.addEventListener('click',()=>{
      const targetField = btn.closest('.rt-toolbar').dataset.for;
      const editable = document.getElementById(targetField) || document.querySelector(`.rt-editable[data-f="${targetField}"]`);
      if(!editable) return;
      editable.focus();
      try{ document.execCommand(btn.dataset.cmd, false, null); }catch(err){}
    });
  });
}

function resolveTopicByName(catKey, name){
  if(!name) return "general";
  const topics = getCategoryTopics(catKey);
  const found = topics.find(t=>t.name.toLowerCase().trim()===String(name).toLowerCase().trim());
  if(found) return found.id;
  return addTopic(catKey, name);
}

/* ---------- Импорт теории+карточек из JSON (материал от Claude в чате) ---------- */
function importTheoryJSON(key, file, body){
  const reader = new FileReader();
  reader.onload = () => {
    let parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(e){ openInfoModal('Ошибка', 'Файл повреждён или это не JSON. Проверь, что содержимое — валидный JSON, который я тебе дала.'); return; }
    const data = APP_DATA[key];
    const isCustom = !CATEGORY_META.find(m=>m.key===key);
    const fieldKeys = (data.meta.fields || (data.meta.type==='custom'?['front','back','note']:['front','back'])).slice();
    let matCount=0, cardCount=0;

    (parsed.materials||[]).forEach(m=>{
      const topicId = resolveTopicByName(key, m.topic);
      if(!STORE.materials[key]) STORE.materials[key]=[];
      STORE.materials[key].push({
        id:uid('mat'), topicId,
        title: m.title||'Без названия', mainQuestion: m.mainQuestion||'', explanation: m.explanation||'',
        facts: m.facts||'', connections: m.connections||'', application: m.application||'', date: todayISO()
      });
      matCount++;
    });

    (parsed.cards||[]).forEach(c=>{
      const topicId = resolveTopicByName(key, c.topic);
      const vals = {};
      fieldKeys.forEach(f=>{ vals[f] = (c.fields && c.fields[f]) || ''; });
      const id = uid(key);
      const newCard = Object.assign({id, catKey:key, level:0, next_review:todayISO(), topicId}, vals);
      if(isCustom){
        if(!STORE.customCards[key]) STORE.customCards[key]=[];
        STORE.customCards[key].push(newCard);
      } else {
        if(!STORE.extraCards[key]) STORE.extraCards[key]=[];
        STORE.extraCards[key].push(newCard);
      }
      cardCount++;
    });

    saveStore();
    buildAllData();
    renderAll();
    openInfoModal('Импорт завершён', `Добавлено материалов: <b>${matCount}</b>, карточек: <b>${cardCount}</b>.`);
  };
  reader.readAsText(file);
}

function theoryToCardDefaults(fieldDefs, material){
  const vals = {};
  fieldDefs.forEach(([f],i)=>{
    if(i===0) vals[f]=material.mainQuestion;
    else if(i===1) vals[f]=material.explanation;
    else if(i===fieldDefs.length-1) vals[f]=[material.connections,material.application].filter(Boolean).join(' ');
    else vals[f]=material.facts||'';
  });
  return vals;
}

function deleteCard(key, cardId){
  const isCustom = !CATEGORY_META.find(m=>m.key===key);
  if(isCustom){
    if(STORE.customCards[key]) STORE.customCards[key] = STORE.customCards[key].filter(c=>c.id!==cardId);
  } else {
    const extraArr = STORE.extraCards[key]||[];
    if(extraArr.find(c=>c.id===cardId)){
      STORE.extraCards[key] = extraArr.filter(c=>c.id!==cardId);
    } else {
      if(!STORE.deletedCards.includes(cardId)) STORE.deletedCards.push(cardId);
    }
  }
  delete STORE.cardProgress[cardId];
  delete STORE.cardOverrides[cardId];
  delete STORE.cardTopicOverride[cardId];
  const mi = STORE.mistakeIds.indexOf(cardId); if(mi>-1) STORE.mistakeIds.splice(mi,1);
  saveStore();
  buildAllData();
  renderAll();
}

function applyCoverImage(){
  const banner = document.getElementById('coverBanner');
  const label = document.getElementById('coverLabel');
  if(STORE.coverImage){
    banner.style.backgroundImage = `url(${STORE.coverImage})`;
    banner.classList.add('has-image');
    label.textContent = 'Изменить обложку';
  } else {
    banner.style.backgroundImage = 'none';
    banner.classList.remove('has-image');
    label.textContent = '+ Добавить обложку';
  }
}
document.getElementById('coverBanner').addEventListener('click', (e)=>{
  if(e.target.closest('#coverRemove')) return;
  document.getElementById('coverInput').click();
});
document.getElementById('coverRemove').addEventListener('click', (e)=>{
  e.stopPropagation();
  STORE.coverImage = null;
  saveStore();
  applyCoverImage();
});
document.getElementById('coverInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      // Сохраняем оригинальное разрешение (до разумного предела) и высокое
      // качество JPEG — полоса тонкая, но retina-экраны показывают её чётко.
      const maxW = Math.min(img.width, 2600);
      const scale = maxW / img.width;
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width*scale);
      canvas.height = Math.round(img.height*scale);
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      STORE.coverImage = canvas.toDataURL('image/jpeg', 0.93);
      saveStore();
      applyCoverImage();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
});

function applySidebarWidth(w){
  document.getElementById('app').style.gridTemplateColumns = `${w}px 1fr`;
  document.documentElement.style.setProperty('--sidebar-w', w+'px');
}
applySidebarWidth(STORE.sidebarWidth || 256);

/* ---------- Сворачивание сайдбара ---------- */
(function initSidebarToggle(){
  const appEl = document.getElementById('app');
  const toggleBtn = document.getElementById('sidebarToggle');
  function apply(){
    appEl.classList.toggle('sidebar-collapsed', !!STORE.sidebarCollapsed);
    toggleBtn.textContent = STORE.sidebarCollapsed ? '›' : '‹';
    if(!STORE.sidebarCollapsed) applySidebarWidth(STORE.sidebarWidth || 256);
  }
  toggleBtn.addEventListener('click',()=>{
    STORE.sidebarCollapsed = !STORE.sidebarCollapsed;
    saveStore();
    apply();
  });
  apply();
})();
(function initSidebarResize(){
  const resizer = document.getElementById('sidebarResizer');
  let dragging = false;
  function start(e){ dragging = true; resizer.classList.add('dragging'); e.preventDefault(); }
  function move(clientX){
    if(!dragging) return;
    const w = Math.min(420, Math.max(190, clientX));
    applySidebarWidth(w);
  }
  function end(){
    if(!dragging) return;
    dragging = false; resizer.classList.remove('dragging');
    const w = parseInt(document.getElementById('app').style.gridTemplateColumns);
    STORE.sidebarWidth = w;
    saveStore();
  }
  resizer.addEventListener('mousedown', start);
  document.addEventListener('mousemove', (e)=>move(e.clientX));
  document.addEventListener('mouseup', end);
  resizer.addEventListener('touchstart', (e)=>start(e), {passive:false});
  document.addEventListener('touchmove', (e)=>{ if(dragging && e.touches[0]) move(e.touches[0].clientX); }, {passive:false});
  document.addEventListener('touchend', end);
})();

/* ==========================================================================
   21. ИНИЦИАЛИЗАЦИЯ
   ========================================================================== */
applyTheme();
applyCoverImage();
buildAllData();
renderAll();

</script>

    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
