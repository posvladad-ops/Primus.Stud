<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PRIMUS.</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10141C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PRIMUS.">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Unbounded:wght@900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===================== ТОКЕНЫ ТЕМЫ ===================== */
:root{
  --font-display:'Montserrat',sans-serif;
  --font-body:'Montserrat',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --radius-s:8px; --radius-m:12px; --radius-l:18px;
}
html[data-theme="dark"]{
  --bg:#10141C;
  --bg-soft:#151A23;
  --surface:#1A2029;
  --surface-hover:#212836;
  --border:#2A3140;
  --text:#EDEAE0;
  --text-dim:#A39C89;
  --text-faint:#6C7080;
  --accent:#6B3F1F;
  --accent-strong:#8F5A32;
  --accent-soft:rgba(107,63,31,.18);
  --khaki:#8C8058;
  --khaki-soft:rgba(140,128,88,.16);
  --khaki-ring:#615837;
  --good:#7C9473;
  --bad:#B5675A;
  --shadow:0 10px 30px rgba(0,0,0,.38);
  --wine:#5E2430;
  --wine-soft:rgba(94,36,48,.20);
  --eis-uiq:rgba(94,36,48,.32);
  --eis-inq:rgba(110,63,60,.30);
  --eis-uniq:rgba(92,82,48,.28);
  --eis-ninq:rgba(98,90,52,.24);
  --choc-bitter:#2A1710;
  --modal-smoky:#3A3833;
}
html[data-theme="light"]{
  --bg:#EDEBE6;
  --bg-soft:#E6E3DC;
  --surface:#FBFAF7;
  --surface-hover:#F1EEE7;
  --border:#D9D5CB;
  --text:#28251F;
  --text-dim:#6C6759;
  --text-faint:#98917F;
  --accent:#5C3418;
  --accent-strong:#3E2210;
  --accent-soft:rgba(92,52,24,.10);
  --khaki:#6E6440;
  --khaki-soft:rgba(110,100,64,.14);
  --khaki-ring:#5A5230;
  --good:#5C7A52;
  --bad:#A24E42;
  --shadow:0 10px 26px rgba(50,45,35,.08);
  --wine:#7A3540;
  --wine-soft:rgba(122,53,64,.10);
  --eis-uiq:rgba(122,53,64,.22);
  --eis-inq:rgba(135,82,74,.20);
  --eis-uniq:rgba(114,104,66,.18);
  --eis-ninq:rgba(110,100,64,.15);
  --choc-bitter:#2E1C10;
  --modal-smoky:#E9E6DF;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;margin:0 0 .4em;letter-spacing:-.2px;}
a{color:inherit;}
button{font-family:var(--font-body);cursor:pointer;border-radius:var(--radius-s);}
textarea,input,select{border-radius:var(--radius-s);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ===================== LAYOUT ===================== */
#app{display:grid;grid-template-columns:256px 1fr;min-height:100vh;}
.content-col{display:flex;flex-direction:column;min-width:0;}
.cover-banner{
  width:100%;height:120px;background:var(--bg-soft);border-bottom:1px solid var(--border);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  background-size:cover;background-position:center;position:relative;flex-shrink:0;
  transition:background-color .15s;
}
.cover-banner:hover{background-color:var(--surface-hover);}
.cover-banner .cover-label{font-size:11px;color:var(--text-faint);font-family:var(--font-mono);letter-spacing:.5px;text-transform:uppercase;padding:4px 10px;border-radius:20px;transition:opacity .15s;}
.cover-banner.has-image .cover-label{opacity:0;background:rgba(10,10,10,.55);color:#fff;}
.cover-banner.has-image:hover .cover-label{opacity:1;}
.cover-remove{
  position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:50%;
  background:rgba(10,10,10,.35);color:rgba(255,255,255,.85);border:none;font-size:12px;font-weight:300;display:none;
  align-items:center;justify-content:center;cursor:pointer;line-height:1;opacity:0;transition:opacity .15s,background .15s;
}
.cover-banner.has-image:hover .cover-remove{opacity:1;}
.cover-banner.has-image .cover-remove{display:flex;}
.cover-remove:hover{background:rgba(10,10,10,.6);}
.sidebar{
  background:var(--bg-soft);
  border-right:1px solid var(--border);
  padding:20px 14px;
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.sidebar-resizer{
  position:absolute;top:0;right:-3px;width:6px;height:100%;cursor:col-resize;z-index:20;background:transparent;
}
.sidebar-resizer:hover,.sidebar-resizer.dragging{background:var(--accent-soft);}
.brand{padding:10px 8px 6px;}
.brand h1{
  font-family:'Unbounded',var(--font-display);font-weight:900;
  font-size:26px;letter-spacing:2.6px;
  transform:scaleX(1.15) scaleY(0.94);transform-origin:left center;
  display:inline-block;white-space:nowrap;
  color:var(--text);
}
html[data-theme="light"] .brand h1{ color:var(--choc-bitter); }
.brand .sub{font-size:11.5px;color:var(--text-dim);margin-top:3px;letter-spacing:.2px;}
.aura-badge{margin:10px 8px 16px;padding:8px 12px;border-radius:var(--radius-s);background:var(--accent-soft);color:var(--accent-strong);font-family:var(--font-mono);font-size:11.5px;font-weight:600;text-align:center;}

.nav-group{margin-bottom:6px;}
.nav-label{font-family:var(--font-mono);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-faint);padding:14px 10px 6px;}
.nav-item{
  display:flex;align-items:center;gap:9px;
  padding:8px 10px;border-radius:var(--radius-s);
  font-size:13.5px;color:var(--text-dim);
  cursor:pointer;transition:background .12s,color .12s;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.nav-item:hover{background:var(--surface-hover);color:var(--text);}
.nav-item.active{background:var(--accent-soft);color:var(--accent-strong);font-weight:600;}
.mono-badge{
  width:20px;height:20px;border-radius:6px;background:var(--khaki-soft);color:var(--khaki);
  font-family:var(--font-mono);font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.nav-item.active .mono-badge{background:var(--accent);color:#fff;}
.nav-item .count{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);}
.nav-add{margin:8px 6px 2px;padding:7px 10px;border-radius:var(--radius-s);border:1px dashed var(--border);background:transparent;color:var(--text-faint);font-size:12.5px;text-align:left;}
.nav-add:hover{border-color:var(--accent);color:var(--accent-strong);}

.theme-toggle{
  margin-top:auto;display:flex;align-items:center;justify-content:space-between;
  padding:10px;border-radius:var(--radius-s);background:var(--surface);
  border:1px solid var(--border);font-size:12.5px;color:var(--text-dim);
}
.switch{position:relative;width:36px;height:20px;background:var(--border);border-radius:20px;border:none;flex-shrink:0;}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;background:var(--accent);border-radius:50%;transition:transform .18s;}
html[data-theme="light"] .switch::after{transform:translateX(16px);}
.switch.on::after{transform:translateX(16px);background:var(--accent-strong);}

.main{padding:26px 34px 60px;max-width:1180px;}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px;gap:16px;flex-wrap:wrap;}
.topbar h2{font-size:25px;}
.topbar .desc{color:var(--text-dim);font-size:13.5px;margin-top:2px;max-width:560px;}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:var(--radius-s);border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-size:13px;font-weight:500;
  transition:border-color .12s,background .12s;
}
.btn:hover{border-color:var(--accent);background:var(--surface-hover);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}

/* Aura hero */
.aura-hero{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);padding:24px 28px;box-shadow:var(--shadow);}
.aura-hero-sm{padding:16px 22px;}
.aura-hero-sm .aura-num{font-size:30px;}
.aura-hero-sm .aura-unit{font-size:13px;}
.aura-hero-sm .aura-bar{margin-top:8px;height:6px;}
.aura-num{font-family:var(--font-display);font-size:44px;font-weight:800;color:var(--accent-strong);}
.aura-unit{font-size:16px;font-weight:600;color:var(--text-dim);margin-left:8px;}
.aura-level{font-size:13px;color:var(--text-dim);margin-top:4px;}
.aura-bar{height:8px;border-radius:8px;background:var(--bg-soft);margin-top:12px;overflow:hidden;}
.aura-bar-fill{height:100%;background:var(--accent);border-radius:8px;transition:width .3s;}
.streak-row{margin-top:10px;font-size:12.5px;color:var(--text-dim);}

.checklist{display:flex;flex-direction:column;gap:10px;margin-top:12px;}
.check-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:14px 16px;display:flex;align-items:center;gap:12px;}
.check-item.done{border-color:var(--good);}
.check-box{width:20px;height:20px;border-radius:6px;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;}
.check-item.done .check-box{background:var(--good);border-color:var(--good);color:#fff;}
.check-body{flex:1;}
.check-top{display:flex;justify-content:space-between;font-size:13px;font-weight:500;margin-bottom:8px;}
.check-bar{height:6px;border-radius:6px;background:var(--bg-soft);overflow:hidden;}
.check-bar-fill{height:100%;background:var(--accent);border-radius:6px;}
.check-item.done .check-bar-fill{background:var(--good);}
.bonus-banner{margin-top:14px;padding:12px 16px;border-radius:var(--radius-s);background:rgba(124,148,115,.15);border:1px solid var(--good);color:var(--good);font-size:13px;font-weight:600;}
.bonus-hint{margin-top:14px;padding:12px 16px;border-radius:var(--radius-s);background:var(--bg-soft);border:1px dashed var(--border);color:var(--text-dim);font-size:12.5px;}

.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:22px;}
.home-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:18px;cursor:pointer;transition:border-color .12s;}
.home-card:hover{border-color:var(--accent);}
.home-card-num{font-family:var(--font-display);font-size:28px;font-weight:800;color:var(--accent-strong);}
.home-card-label{font-size:12.5px;color:var(--text-dim);margin-top:4px;}
.home-card.rno-card{border-color:var(--bad);}
.home-card.rno-card .home-card-num{color:var(--bad);}

.week-row{display:flex;gap:8px;margin-top:16px;}
.week-day{flex:1;text-align:center;padding:10px 4px;border-radius:var(--radius-s);background:var(--surface);border:1px solid var(--border);}
.week-day.today{border-color:var(--accent);}
.week-day .wd-label{font-size:10.5px;color:var(--text-faint);font-family:var(--font-mono);}
.week-day .wd-dot{width:10px;height:10px;border-radius:50%;background:var(--border);margin:6px auto 0;}
.week-day.done .wd-dot{background:var(--good);}

/* Cards grid */
.filters{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap;}
.chip{padding:6px 12px;border-radius:20px;border:1px solid var(--border);font-size:12px;color:var(--text-dim);background:var(--surface);cursor:pointer;}
.chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;}
.flashcard{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);
  padding:16px;transition:border-color .12s;position:relative;
}
.flashcard:hover{border-color:var(--accent);}
.fc-topic{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--text-faint);margin-bottom:6px;}
.flashcard .fc-top{font-family:var(--font-display);font-size:16.5px;font-weight:700;margin-bottom:4px;}
.flashcard .fc-sub{font-size:12.5px;color:var(--accent-strong);font-weight:500;margin-bottom:8px;}
.flashcard .fc-body{font-size:12.8px;color:var(--text-dim);line-height:1.55;}
.flashcard .fc-usage{margin-top:10px;padding-top:9px;border-top:1px dashed var(--border);font-size:11.8px;color:var(--khaki);}
.level-badge{position:absolute;top:12px;right:12px;font-family:var(--font-mono);font-size:10px;padding:2px 7px;border-radius:20px;background:var(--khaki-soft);color:var(--khaki);}
.level-badge.mastered{background:rgba(124,148,115,.18);color:var(--good);}
.fc-actions{display:flex;gap:6px;margin-top:10px;}
.icon-btn{border:1px solid var(--border);background:var(--surface);border-radius:6px;padding:4px 8px;color:var(--text-faint);font-size:11px;}
.icon-btn:hover{color:var(--bad);border-color:var(--bad);}
.icon-btn.edit:hover{color:var(--accent);border-color:var(--accent);}

/* Practice */
.practice-wrap{max-width:700px;margin-top:4px;}
.mode-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.mode-tab{padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;color:var(--text-dim);}
.mode-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
.mode-count{font-family:var(--font-mono);font-size:10px;opacity:.75;}
.stat-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.stat-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:12px 16px;min-width:110px;}
.stat-box .num{font-family:var(--font-display);font-size:22px;font-weight:800;}
.stat-box .lbl{font-size:11px;color:var(--text-faint);margin-top:2px;}
.task-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);padding:26px;box-shadow:var(--shadow);}
.task-type{font-family:var(--font-mono);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin-bottom:10px;}
.task-prompt{font-family:var(--font-display);font-size:18px;font-weight:600;line-height:1.4;margin-bottom:16px;}
.opt-list{display:flex;flex-direction:column;gap:8px;margin:14px 0;}
.opt{padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius-s);font-size:13.5px;background:var(--bg-soft);transition:border-color .1s,background .1s;}
.opt:hover{border-color:var(--accent);}
.opt.correct{border-color:var(--good);background:rgba(124,148,115,.14);}
.opt.wrong{border-color:var(--bad);background:rgba(181,103,90,.14);}
.open-answer{width:100%;min-height:90px;padding:12px;border-radius:var(--radius-s);border:1px solid var(--border);background:var(--bg-soft);color:var(--text);font-family:var(--font-body);font-size:13.5px;margin-bottom:12px;resize:vertical;}
.answer-box{margin-top:14px;padding:14px;border-radius:var(--radius-s);background:var(--bg-soft);border:1px solid var(--border);font-size:13.5px;display:none;}
.answer-box.show{display:block;}
.answer-box .a-label{font-family:var(--font-mono);font-size:10.5px;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;}
.grade-row{display:flex;gap:8px;margin-top:14px;}
.btn-good{background:var(--good);border-color:var(--good);color:#fff;}
.btn-bad{background:var(--bad);border-color:var(--bad);color:#fff;}
.task-footer{display:flex;justify-content:space-between;align-items:center;margin-top:18px;}
.olympiad-tag{font-size:10.5px;padding:3px 8px;border-radius:10px;background:var(--accent-soft);color:var(--accent-strong);font-family:var(--font-mono);}
.toggle-row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-dim);margin:10px 0 16px;}

/* Match mode */
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:16px 0;}
.match-col{display:flex;flex-direction:column;gap:8px;}
.match-item{padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius-s);font-size:13px;background:var(--bg-soft);cursor:pointer;}
.match-item:hover{border-color:var(--accent);}
.match-item.selected{border-color:var(--accent);background:var(--accent-soft);}
.match-item.correct{border-color:var(--good);background:rgba(124,148,115,.14);cursor:default;opacity:.7;}
.match-item.wrong{border-color:var(--bad);background:rgba(181,103,90,.14);}

/* Review / RNO */
.review-summary{font-family:var(--font-display);font-size:19px;font-weight:700;margin-bottom:14px;}
.art-row{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--radius-s);border:1px solid var(--border);margin-bottom:6px;cursor:pointer;font-size:12.5px;}
.art-row:hover{border-color:var(--accent);background:var(--surface-hover);}
.art-top{font-weight:600;}
.art-sub{color:var(--text-dim);}
.art-cat{margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--text-faint);text-transform:uppercase;}
.review-groups{display:flex;flex-direction:column;gap:8px;}
.review-group{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-s);padding:12px 14px;cursor:pointer;font-size:13px;}
.review-group.active{border-color:var(--accent);background:var(--accent-soft);}
.rg-mark{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;}
.rg-mark.rno-mark{background:var(--bad);}
.rg-text{flex:1;}
.rg-count{font-family:var(--font-mono);font-size:11.5px;color:var(--text-faint);}
.rno-banner{padding:12px 16px;border-radius:var(--radius-s);background:rgba(181,103,90,.12);border:1px solid var(--bad);color:var(--bad);font-size:13px;font-weight:600;margin-bottom:18px;}

/* Calendar — компактная, лаконичная */
.cal-wrap{max-width:320px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px;}
.cal-month-title{font-family:var(--font-display);font-size:13px;font-weight:700;margin:16px 0 6px;color:var(--text-dim);}
.cal-cell{aspect-ratio:1;border-radius:5px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text-dim);cursor:pointer;}
.cal-cell.empty{border:none;background:transparent;cursor:default;}
.cal-cell.filled{background:var(--khaki-ring);color:#fff;border-color:var(--khaki-ring);font-weight:600;}
.cal-cell .n{font-size:10px;}
.cal-dow{text-align:center;font-size:9px;color:var(--text-faint);font-family:var(--font-mono);}

/* Progress */
.prog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-top:16px;}
.prog-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:18px;display:flex;align-items:center;gap:14px;}
.prog-card .p-info{flex:1;}
.prog-card h4{font-size:14px;margin-bottom:3px;}
.prog-card .p-sub{font-size:11.5px;color:var(--text-faint);}

/* Perfect Usage */
.shine-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:14px 16px;margin-bottom:10px;}
.shine-item .s-top{display:flex;justify-content:space-between;font-size:13px;font-weight:600;}
.shine-item .s-cat{font-family:var(--font-mono);font-size:10px;color:var(--accent);text-transform:uppercase;}
.shine-item .s-usage{margin-top:6px;font-size:12.8px;color:var(--khaki);border-left:2px solid var(--accent);padding-left:9px;}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(10,10,10,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
.overlay.show{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);padding:24px;width:100%;max-width:460px;max-height:86vh;overflow-y:auto;box-shadow:var(--shadow);}
.modal.modal-lg{max-width:640px;}
.modal h3{font-size:18px;margin-bottom:14px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:11.5px;color:var(--text-faint);margin-bottom:5px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.5px;}
.field input,.field textarea,.field select{
  width:100%;padding:9px 11px;border:1px solid var(--border);
  background:var(--bg-soft);color:var(--text);font-family:var(--font-body);font-size:13px;
}
.field textarea{min-height:64px;resize:vertical;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
.topic-row,.manage-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;transition:transform .15s;}
.topic-row.dragging{opacity:.85;box-shadow:var(--shadow);border-radius:var(--radius-s);background:var(--surface);z-index:5;}
.drag-handle{cursor:grab;color:var(--text-faint);font-size:16px;padding:2px 4px;touch-action:none;user-select:none;}
.drag-handle:active{cursor:grabbing;color:var(--accent-strong);}
.topic-name-input,.manage-name-input{flex:1;padding:8px 10px;border:1px solid var(--border);background:var(--bg-soft);color:var(--text);font-size:13px;border-radius:var(--radius-s);}
.lookup-row{display:flex;align-items:center;gap:8px;margin:-6px 0 12px;}
.lookup-hint{font-size:10.5px;color:var(--text-faint);}
.set-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px;padding:10px;border:1px solid var(--border);border-radius:var(--radius-s);background:var(--bg-soft);}
.set-row-num{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);width:18px;padding-top:8px;flex-shrink:0;}
.set-row-fields{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px;}
.set-input{padding:7px 9px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12.5px;border-radius:6px;}
.mini-btn{border:1px solid var(--border);background:var(--surface);border-radius:6px;padding:4px 7px;color:var(--text-faint);font-size:11px;}
.mini-btn:hover{color:var(--accent);border-color:var(--accent);}
.mini-btn.pin-on{color:var(--accent-strong);border-color:var(--accent-strong);background:var(--accent-soft);}

/* Study / flip mode (Quizlet-style) */
.study-card-wrap{perspective:1200px;margin:10px 0 18px;}
.study-card{
  min-height:230px;border-radius:var(--radius-l);border:1px solid var(--border);background:var(--surface);
  box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;text-align:center;
  padding:30px;cursor:pointer;position:relative;
}
.study-card .sc-hint{position:absolute;bottom:12px;left:0;right:0;font-size:10.5px;color:var(--text-faint);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.6px;}
.study-card .sc-topic{position:absolute;top:12px;left:16px;font-size:10px;color:var(--text-faint);font-family:var(--font-mono);text-transform:uppercase;}
.study-card .sc-main{font-family:var(--font-display);font-size:21px;font-weight:700;}
.study-card .sc-sub{font-size:13px;color:var(--text-dim);margin-top:10px;line-height:1.5;}
.study-progress{font-size:12px;color:var(--text-faint);text-align:center;margin-bottom:6px;}
.study-actions{display:flex;gap:8px;justify-content:center;}
.study-actions .btn{flex:1;max-width:170px;}
.btn-know{background:var(--good);border-color:var(--good);color:#fff;}
.btn-dontknow{background:var(--bad);border-color:var(--bad);color:#fff;}
.btn-again{background:var(--khaki);border-color:var(--khaki);color:#fff;}

/* Theory / Feynman materials */
.theory-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:18px 20px;margin-bottom:14px;}
.theory-topic{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--text-faint);margin-bottom:8px;}
.theory-title{font-family:var(--font-display);font-size:17px;font-weight:700;margin-bottom:10px;}
.theory-block{margin-bottom:10px;}
.theory-block .tb-label{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);margin-bottom:3px;}
.theory-block .tb-body{font-size:13px;color:var(--text-dim);line-height:1.6;}
.theory-actions{display:flex;gap:8px;margin-top:12px;}
.theory-title-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px;}
.theory-title-row .theory-title{margin-bottom:0;}
.theory-date{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);white-space:nowrap;opacity:.7;}
.theory-keywords{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px;}
.kw-chip{display:inline-flex;align-items:center;gap:5px;background:var(--accent-soft);color:var(--accent-strong);border-radius:12px;padding:3px 9px;font-size:11px;font-weight:500;}
.kw-chip.editable button{background:none;border:none;color:inherit;opacity:.6;cursor:pointer;padding:0;font-size:10px;}
.kw-chip.editable button:hover{opacity:1;}
.theory-material-preview{max-height:140px;overflow:hidden;position:relative;}

/* ---------- Полноэкранный редактор теории ---------- */
.theory-editor{max-width:820px;}
.te-header{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);padding:20px 22px;margin-bottom:20px;}
.te-title-input{width:100%;border:none;background:transparent;font-family:var(--font-display);font-size:24px;font-weight:700;color:var(--text);padding:0 0 10px;outline:none;}
.te-meta-row{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--text-faint);align-items:center;padding-top:10px;border-top:1px dashed var(--border);}
.te-meta-row label{display:flex;align-items:center;gap:6px;}
.te-meta-row select,.te-meta-row input[type=date]{padding:5px 8px;border:1px solid var(--border);background:var(--bg-soft);color:var(--text);border-radius:6px;font-size:12px;}
.te-section{margin-bottom:26px;}
.te-section-title{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--accent);margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.te-section-later{opacity:.92;}
.te-material-box{min-height:260px;}
.te-notes-box{min-height:110px;background:var(--bg-soft);}
.rt-btn.hl{width:20px;height:20px;border-radius:4px;padding:0;border:1px solid var(--border);}
.kw-editor{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;min-height:26px;}
.te-ai-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border:1px dashed var(--accent);border-radius:var(--radius-m);padding:14px 16px;margin-bottom:20px;}
.te-ai-hint{font-size:11.5px;color:var(--text-dim);flex:1;min-width:200px;}
.te-footer{display:flex;justify-content:flex-end;gap:10px;padding-bottom:30px;}

.empty-state{padding:50px 20px;text-align:center;color:var(--text-faint);}

@media (max-width:820px){
  #app{grid-template-columns:1fr !important;}
  .sidebar{position:relative;height:auto;flex-direction:column;flex-wrap:nowrap;top:auto;width:100% !important;}
  .sidebar-resizer{display:none;}
  .main{padding:18px;}
  .match-grid{grid-template-columns:1fr;}
  .cover-banner{height:44px;}
  #app.sidebar-collapsed .sidebar{display:none;}
  .sidebar-toggle{position:fixed !important;top:10px !important;right:10px !important;left:auto !important;}
  .brand{padding:30px 8px 10px;}
}
:root{ --sidebar-w:256px; }
.sidebar-toggle{
  position:fixed;top:14px;left:calc(var(--sidebar-w) - 13px);width:28px;height:28px;border-radius:50%;
  background:var(--surface);border:1px solid var(--border);color:var(--text-dim);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;z-index:200;
  box-shadow:var(--shadow);transition:left .15s;
}
.sidebar-toggle:hover{color:var(--accent-strong);border-color:var(--accent);}
#app.sidebar-collapsed{grid-template-columns:0px 1fr !important;}
#app.sidebar-collapsed .sidebar{overflow:hidden;padding-left:0;padding-right:0;border-right:none;}
#app.sidebar-collapsed .sidebar > *:not(.sidebar-toggle){display:none;}
#app.sidebar-collapsed .sidebar-toggle{left:10px;}

/* ==========================================================================
   OVERVIEW: вкладки внутри Progress
   ========================================================================== */
.ov-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
.ov-tab{padding:8px 15px;border-radius:20px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;color:var(--text-dim);}
.ov-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}

/* ---------- План: базовый минимум / роскошный максимум ---------- */
.plan-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;align-items:start;}
@media (max-width:900px){.plan-grid{grid-template-columns:1fr;}}
.plan-tier-label{font-size:11px;color:var(--text-faint);font-weight:400;letter-spacing:1.2px;text-transform:uppercase;
  opacity:.6;margin:18px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.plan-tier-label:first-child{margin-top:0;}
.plan-task{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-s);padding:10px 12px;margin-bottom:7px;}
.plan-task .pt-check{width:18px;height:18px;border-radius:5px;border:2px solid var(--border);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;}
.plan-task.done .pt-check{background:var(--good);border-color:var(--good);color:#fff;}
.plan-task.done .pt-text{text-decoration:line-through;color:var(--text-faint);}
.plan-task .pt-quad{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.plan-task .pt-text{flex:1;font-size:13px;cursor:text;}
.plan-task .pt-deadline{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);white-space:nowrap;}
.plan-task .pt-del{border:none;background:transparent;color:var(--text-faint);cursor:pointer;font-size:12px;padding:2px 4px;}
.plan-task .pt-del:hover{color:var(--bad);}
.plan-add-btn{width:100%;padding:9px;border-radius:var(--radius-s);border:1px dashed var(--border);background:transparent;color:var(--text-faint);font-size:12.5px;margin-top:4px;}
.plan-add-btn:hover{border-color:var(--accent);color:var(--accent-strong);}
.plan-goal-edit{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-faint);margin-top:4px;}
.plan-goal-edit input{width:42px;padding:3px 5px;font-size:11px;border:1px solid var(--border);background:var(--bg-soft);color:var(--text);border-radius:4px;text-align:center;}

/* ---------- Матрица Эйзенхауэра ---------- */
.eis-wrap{border:1px solid var(--border);border-radius:var(--radius-l);padding:18px;background:var(--surface);}
.eis-title{font-family:var(--font-display);font-size:13px;font-weight:600;color:var(--khaki);margin-bottom:14px;text-align:center;letter-spacing:3.5px;text-transform:uppercase;opacity:.55;transform:scaleX(1.15);}
.eis-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;min-height:340px;}
.eis-cell{border-radius:var(--radius-m);padding:10px;display:flex;flex-direction:column;color:var(--text);position:relative;overflow:hidden;border:1px solid var(--border);}
.eis-cell .ec-label{font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:.4px;opacity:.75;line-height:1.4;margin-bottom:6px;}
.eis-cell .ec-add{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--surface);border:1px solid var(--border);
  color:var(--text);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;}
.eis-cell .ec-add:hover{background:var(--accent-soft);border-color:var(--accent);}
.eis-cell.uiq{background:var(--eis-uiq);}
.eis-cell.inq{background:var(--eis-inq);}
.eis-cell.uniq{background:var(--eis-uniq);}
.eis-cell.ninq{background:var(--eis-ninq);}
.ec-chips{display:flex;flex-direction:column;gap:4px;overflow-y:auto;flex:1;}
.eq-chip{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:5px 7px;font-size:11px;cursor:pointer;line-height:1.3;}
.eq-chip:hover{border-color:var(--accent);}
.eq-chip-toggle{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--text-faint);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:transparent;}
.eq-chip-toggle:hover{color:var(--good);border-color:var(--good);}
.eq-chip-date{margin-left:auto;font-family:var(--font-mono);font-size:9px;opacity:.7;white-space:nowrap;}
.eq-empty{font-size:10.5px;opacity:.5;padding:4px 0;}

/* ---------- Недельная шкала планера ---------- */
.week-strip{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
.week-days{display:flex;gap:5px;flex:1;}
.week-day-pick{flex:1;text-align:center;padding:8px 2px;border-radius:var(--radius-s);background:var(--surface);border:1px solid var(--border);cursor:pointer;}
.week-day-pick:hover{border-color:var(--accent);}
.week-day-pick.active{background:var(--accent-soft);border-color:var(--accent);}
.week-day-pick.done .wd-num{color:var(--good);}
.week-day-pick .wd-label{font-family:var(--font-mono);font-size:9px;color:var(--text-faint);text-transform:uppercase;}
.week-day-pick .wd-num{font-family:var(--font-display);font-size:14px;font-weight:700;margin-top:2px;}

/* ---------- Модалка добавления задачи (smoky warm grey) ---------- */
.smoky-modal{background:var(--modal-smoky) !important;border-radius:var(--radius-l);}
html[data-theme="dark"] .smoky-modal .field label{color:#C9C4B8;}
html[data-theme="dark"] .smoky-modal h3{color:#F0EDE5;}
html[data-theme="dark"] .smoky-modal{color:#F0EDE5;}

/* ---------- Заметки ---------- */
.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
.note-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:14px 16px;display:flex;flex-direction:column;min-height:120px;}
.note-editable{min-height:220px;}
.note-editable h2,.n-body h2{font-family:var(--font-display);font-size:19px;font-weight:700;margin:10px 0 6px;}
.note-editable h3,.n-body h3{font-family:var(--font-display);font-size:15px;font-weight:600;margin:8px 0 4px;color:var(--text-dim);}
.note-card .n-title{font-family:var(--font-display);font-weight:700;font-size:14px;margin-bottom:6px;}
.note-card .n-body{font-size:12.5px;color:var(--text-dim);line-height:1.5;flex:1;overflow:hidden;max-height:100px;}
.note-card .n-date{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);margin-top:8px;}
.note-card .n-actions{display:flex;gap:6px;margin-top:8px;}

/* ---------- Таймер: Pomodoro + Stopwatch ---------- */
.timer-tabs{display:flex;gap:6px;margin-bottom:18px;}
.timer-tabs .btn{border-radius:3px;}
.timer-display-wrap{
  max-width:400px;margin:0 auto 18px;padding:32px 20px 26px;border-radius:var(--radius-l);
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);text-align:center;
}
.timer-display{
  font-family:var(--font-display);font-size:58px;font-weight:700;margin:0;
  letter-spacing:1px;transform:scaleX(1.12) scaleY(0.96);transform-origin:center;
  color:var(--choc-bitter);font-variant-numeric:tabular-nums;
  text-shadow:0 1px 0 rgba(255,255,255,.25), 0 2px 6px rgba(0,0,0,.06);
}
html[data-theme="dark"] .timer-display{color:#EFE4D2;text-shadow:0 1px 0 rgba(0,0,0,.3), 0 2px 10px rgba(0,0,0,.35);}
.timer-subject-input{width:100%;max-width:360px;margin:0 auto 16px;display:block;padding:10px 14px;border-radius:3px;
  border:1px solid var(--border);background:var(--bg-soft);color:var(--text);font-size:13px;text-align:center;}
.timer-controls{display:flex;gap:10px;justify-content:center;margin-bottom:20px;}
.btn-timer-primary{background:var(--wine);border-color:var(--wine);color:#fff;padding:10px 24px;border-radius:3px;}
.btn-timer-secondary{background:var(--khaki-ring);border-color:var(--khaki-ring);color:#fff;border-radius:3px;}
.btn-timer-ghost{background:var(--choc-bitter);border-color:var(--choc-bitter);color:#fff;border-radius:3px;}
.pomo-progress{width:100%;max-width:360px;margin:0 auto 16px;height:4px;border-radius:2px;background:var(--bg-soft);overflow:hidden;}
.pomo-progress-fill{height:100%;background:var(--wine);transition:width 1s linear;}
.time-records{margin-top:24px;}
.time-record-row{display:flex;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--border);font-size:12.5px;}
.time-record-row .tr-subject{font-weight:500;}
.time-record-row .tr-dur{font-family:var(--font-mono);color:var(--text-faint);}

/* ---------- Расписание ---------- */
.sched-day{margin-bottom:18px;}
.sched-day-title{font-family:var(--font-display);font-size:14px;font-weight:700;color:var(--accent-strong);margin-bottom:8px;}
.sched-item{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius-s);padding:10px 14px;margin-bottom:6px;}
.sched-item .si-time{font-family:var(--font-mono);font-size:12px;color:var(--accent-strong);font-weight:600;}
.sched-item .si-main{font-size:13px;}
.sched-item .si-meta{font-size:11px;color:var(--text-faint);margin-top:2px;}
.sched-item .si-del{border:none;background:transparent;color:var(--text-faint);cursor:pointer;font-size:12px;}

/* ---------- Прогресс: предметы с раскрытием тем ---------- */
.subj-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:16px;cursor:pointer;}
.subj-card-top{display:flex;align-items:center;gap:14px;}
.subj-topics{margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);display:none;}
.subj-card.expanded .subj-topics{display:block;}
.subj-topic-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:11.5px;}
.subj-topic-row .stn{flex:1;color:var(--text-dim);}
.subj-topic-row .stb{flex:1.4;height:5px;border-radius:5px;background:var(--bg-soft);overflow:hidden;}
.subj-topic-row .stb-fill{height:100%;background:var(--khaki-ring);}
.subj-topic-row .stp{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);width:32px;text-align:right;}

/* ---------- Вкладка Темы (внутри предмета) ---------- */
.topics-tab-list{display:flex;flex-direction:column;gap:8px;max-width:520px;}

/* ---------- Rich text toolbar для карточек ---------- */
.rt-toolbar{display:flex;gap:4px;margin-bottom:4px;}
.rt-btn{width:26px;height:26px;border:1px solid var(--border);background:var(--surface);border-radius:5px;font-size:12px;color:var(--text-dim);cursor:pointer;}
.rt-btn:hover{border-color:var(--accent);color:var(--accent-strong);}
.rt-btn.b{font-weight:800;}
.rt-btn.i{font-style:italic;}
.rt-btn.s{text-decoration:line-through;}
.rt-btn.u{text-decoration:underline;}
.rt-editable{min-height:56px;padding:9px 11px;border:1px solid var(--border);background:var(--bg-soft);color:var(--text);
  font-family:var(--font-body);font-size:13px;border-radius:var(--radius-s);outline:none;}
.rt-attach-row{display:flex;align-items:center;gap:10px;margin-top:6px;}
.rt-attach-thumb{width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--border);}
.rt-attach-chip{font-size:11px;color:var(--text-dim);background:var(--bg-soft);padding:5px 10px;border-radius:14px;border:1px solid var(--border);}
.fc-attach{margin-top:8px;max-width:100%;border-radius:8px;border:1px solid var(--border);}

/* ---------- Тетрадь (рисование стилусом: перо/маркер/ластик, бесконечный скролл) ---------- */
.nb-toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px;}
.nb-title{font-family:var(--font-display);font-size:16px;font-weight:700;}
.nb-page-nav{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-dim);margin-left:auto;}
.nb-controls{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);}
.nb-group{display:flex;align-items:center;gap:6px;}
.nb-group select{padding:6px 8px;border:1px solid var(--border);background:var(--bg-soft);color:var(--text);border-radius:6px;font-size:12.5px;}
.nb-group-label{font-family:var(--font-mono);font-size:9.5px;text-transform:uppercase;color:var(--text-faint);margin-right:2px;}
.nb-colors{gap:5px;flex-wrap:wrap;max-width:220px;}
.nb-swatch{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);cursor:pointer;padding:0;}
.nb-swatch.active{border-color:var(--accent-strong);transform:scale(1.2);}
.nb-slider-group{gap:8px;}
.nb-slider-group input[type=range]{width:90px;accent-color:var(--accent);}
.nb-scroll{
  max-height:72vh;overflow-y:auto;overflow-x:hidden;border-radius:var(--radius-m);border:1px solid var(--border);
  box-shadow:var(--shadow);padding:14px;background:var(--bg-soft);
  -webkit-user-select:none;user-select:none;touch-action:pan-y;
}
.nb-scroll-inner{display:flex;flex-direction:column;gap:14px;transition:transform .08s ease-out;}
.nb-page{position:relative;width:100%;height:900px;border-radius:var(--radius-s);overflow:hidden;flex-shrink:0;-webkit-user-select:none;user-select:none;}
.nb-canvas{position:absolute;top:0;left:0;width:100%;height:100%;cursor:crosshair;touch-action:none;-webkit-user-select:none;user-select:none;}
.nb-canvas-live{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
.nb-page-del{position:absolute;bottom:8px;right:8px;font-size:10.5px;padding:4px 9px;border-radius:12px;border:1px solid rgba(0,0,0,.15);background:rgba(255,255,255,.7);color:#5a5044;cursor:pointer;}

.nb-page.paper-white{background-color:#FFFFFF;}
.nb-page.paper-black{background-color:#1B1B1B;}

<script>
/* ==========================================================================
   ЛОГИКА ПРИЛОЖЕНИЯ PRIMUS.
   ========================================================================== */

/* ---------- Утилиты дат ---------- */
function todayISO(){ return new Date().toISOString().slice(0,10); }
function addDays(iso,days){ const d=new Date(iso+"T00:00:00"); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }
function fmtDate(iso){ const d=new Date(iso+"T00:00:00"); return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'}); }
function uid(prefix){ return prefix+"_"+Math.random().toString(36).slice(2,9); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function sample(arr,n){ return shuffle(arr).slice(0,n); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function stripHtml(html){
  if(html==null) return '';
  const tmp = document.createElement('div');
  tmp.innerHTML = String(html);
  return (tmp.textContent||tmp.innerText||'').trim();
}
function renderCardFacePlain(type,c){
  const f = renderCardFace(type,c);
  return { top:stripHtml(f.top), sub:stripHtml(f.sub), body:stripHtml(f.body), usage:stripHtml(f.usage), connection:stripHtml(f.connection) };
}

/* ==========================================================================
   1. STORAGE
   ========================================================================== */
const STORE_KEY = "primus_stud_v2";
function defaultStore(){
  return {
    theme:"dark",
    cardProgress:{}, cardOverrides:{}, extraCards:{}, deletedCards:[],
    customCategories:[], customCards:{},
    customTopics:{}, topicRenames:{}, deletedTopics:{}, cardTopicOverride:{},
    learnLog:{}, mistakeIds:[],
    aura:0, streak:0, lastActiveDate:null, dailyProgress:{},
    categoryOrder:[], pinnedCategories:[], categoryRenames:{},
    topicOrder:{}, pinnedTopics:{},
    materials:{},
    sidebarWidth:256, coverImage:null,
    fixedMistakes:0,
    hiddenCategories:[],
    sidebarCollapsed:false,
    dailyGoals:{learned:10, tasks:15, rno:5},
    planTasks:[], // {id,text,tier:'min'|'max',quadrant:'uiq'|'inq'|'uniq'|'ninq',done,deadline,createdDate}
    notes:[], // {id,title,body,date}
    timeRecords:[], // {id,subject,seconds,date,type}
    schedule:[], // {id,day,time,subject,room,professor}
    customTasks:{}, // catKey -> [{id,mode,topic,prompt,options,answer,explanation}]
    notebooks:{} // catKey -> [{id,name,pages:[{id,bg,paper,strokes:[]}]}]
  };
}
function loadStore(){
  let s = defaultStore();
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) s = Object.assign(s, JSON.parse(raw));
  }catch(e){ console.warn("storage read error", e); }
  // защита от неполной структуры
  Object.keys(defaultStore()).forEach(k=>{ if(s[k]===undefined) s[k]=defaultStore()[k]; });
  s.dailyGoals = Object.assign({learned:10,tasks:15,rno:5}, s.dailyGoals||{});
  return s;
}
let STORE = loadStore();
function saveStore(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(STORE)); }
  catch(e){ console.warn("storage write error", e); }
}

/* ==========================================================================
   2. ТЕМЫ (topics) — CRUD внутри категории
   ========================================================================== */
function defaultTopicIdForIndex(meta, idx){
  const t = (meta.topics||[]).find(t=>idx>=t.range[0] && idx<=t.range[1]);
  return t ? t.id : "general";
}
function getCategoryTopics(catKey){
  const meta = (APP_DATA[catKey]||{}).meta || {};
  const deleted = STORE.deletedTopics[catKey]||[];
  const renames = STORE.topicRenames[catKey]||{};
  const defaults = (meta.topics||[]).filter(t=>!deleted.includes(t.id)).map(t=>({id:t.id,name:renames[t.id]||t.name}));
  const custom = (STORE.customTopics[catKey]||[]).filter(t=>!deleted.includes(t.id)).map(t=>({id:t.id,name:renames[t.id]||t.name}));
  const list = defaults.concat(custom);
  list.push({id:"general",name:"Без темы"});
  return list;
}
function getCardTopicId(catKey, card){
  return STORE.cardTopicOverride[card.id] || card.topicId || "general";
}
function topicName(catKey, topicId){
  const t = getCategoryTopics(catKey).find(t=>t.id===topicId);
  return t ? t.name : "Без темы";
}
function getCategoryTopicsOrdered(catKey){
  const all = getCategoryTopics(catKey);
  const byId = {}; all.forEach(t=>byId[t.id]=t);
  const ids = getOrderedTopicIds(catKey);
  const ordered = ids.map(id=>byId[id]).filter(Boolean);
  if(byId['general']) ordered.push(byId['general']);
  return ordered;
}
function addTopic(catKey, name){
  if(!STORE.customTopics[catKey]) STORE.customTopics[catKey]=[];
  const id = uid("topic");
  STORE.customTopics[catKey].push({id,name});
  saveStore(); buildAllData();
  return id;
}
function renameTopic(catKey, topicId, newName){
  if(!STORE.topicRenames[catKey]) STORE.topicRenames[catKey]={};
  STORE.topicRenames[catKey][topicId]=newName;
  // если это пользовательская тема — переименуем прямо в объекте
  const custom = (STORE.customTopics[catKey]||[]).find(t=>t.id===topicId);
  if(custom) custom.name = newName;
  saveStore(); buildAllData();
}
function deleteTopic(catKey, topicId){
  if(!STORE.deletedTopics[catKey]) STORE.deletedTopics[catKey]=[];
  if(!STORE.deletedTopics[catKey].includes(topicId)) STORE.deletedTopics[catKey].push(topicId);
  STORE.customTopics[catKey] = (STORE.customTopics[catKey]||[]).filter(t=>t.id!==topicId);
  saveStore(); buildAllData();
}
function getOrderedTopicIds(catKey){
  const topics = getCategoryTopics(catKey).filter(t=>t.id!=='general');
  const pinned = STORE.pinnedTopics[catKey]||[];
  const order = STORE.topicOrder[catKey] || topics.map(t=>t.id);
  const known = new Set(topics.map(t=>t.id));
  let ids = order.filter(id=>known.has(id));
  topics.forEach(t=>{ if(!ids.includes(t.id)) ids.push(t.id); });
  ids = ids.filter(id=>!pinned.includes(id));
  return pinned.filter(id=>known.has(id)).concat(ids);
}
function moveTopic(catKey, topicId, dir){
  const ids = getOrderedTopicIds(catKey);
  const i = ids.indexOf(topicId);
  const j = i+dir;
  if(i<0||j<0||j>=ids.length) return;
  [ids[i],ids[j]]=[ids[j],ids[i]];
  STORE.topicOrder[catKey] = ids;
  saveStore();
}
function toggleTopicPin(catKey, topicId){
  if(!STORE.pinnedTopics[catKey]) STORE.pinnedTopics[catKey]=[];
  const arr = STORE.pinnedTopics[catKey];
  const i = arr.indexOf(topicId);
  if(i>-1) arr.splice(i,1); else arr.push(topicId);
  saveStore();
}

/* ---------- Управление категориями: переименование / порядок / закреп ---------- */
function getCategoryDisplayName(catKey){
  const rename = STORE.categoryRenames[catKey];
  if(rename) return rename;
  return APP_DATA[catKey] ? APP_DATA[catKey].meta.name : catKey;
}
function renameCategory(catKey, newName){
  const isCustom = !CATEGORY_META.find(m=>m.key===catKey);
  if(isCustom){
    const cc = STORE.customCategories.find(c=>c.key===catKey);
    if(cc) cc.name = newName;
  } else {
    STORE.categoryRenames[catKey] = newName;
  }
  saveStore(); buildAllData();
}
function getOrderedCategoryKeys(){
  const hidden = STORE.hiddenCategories||[];
  const allKeys = CATEGORY_META.map(m=>m.key).concat(STORE.customCategories.map(c=>c.key)).filter(id=>!hidden.includes(id));
  const pinned = (STORE.pinnedCategories||[]).filter(id=>!hidden.includes(id));
  const order = STORE.categoryOrder.length ? STORE.categoryOrder : allKeys;
  let ids = order.filter(id=>allKeys.includes(id));
  allKeys.forEach(id=>{ if(!ids.includes(id)) ids.push(id); });
  ids = ids.filter(id=>!pinned.includes(id));
  return pinned.filter(id=>allKeys.includes(id)).concat(ids);
}
function deleteCategory(catKey){
  const isCustom = !CATEGORY_META.find(m=>m.key===catKey);
  if(isCustom){
    STORE.customCategories = STORE.customCategories.filter(c=>c.key!==catKey);
    delete STORE.customCards[catKey];
    delete STORE.materials[catKey];
    delete STORE.notebooks[catKey];
    delete STORE.customTasks[catKey];
    delete STORE.customTopics[catKey];
    delete STORE.topicRenames[catKey];
    delete STORE.deletedTopics[catKey];
    delete STORE.topicOrder[catKey];
    delete STORE.pinnedTopics[catKey];
  } else {
    if(!STORE.hiddenCategories) STORE.hiddenCategories=[];
    if(!STORE.hiddenCategories.includes(catKey)) STORE.hiddenCategories.push(catKey);
  }
  if(VIEW===catKey) VIEW='progress';
  saveStore();
  buildAllData();
}
function moveCategory(catKey, dir){
  const ids = getOrderedCategoryKeys();
  const i = ids.indexOf(catKey);
  const j = i+dir;
  if(i<0||j<0||j>=ids.length) return;
  [ids[i],ids[j]]=[ids[j],ids[i]];
  STORE.categoryOrder = ids;
  saveStore();
}
function toggleCategoryPin(catKey){
  if(!STORE.pinnedCategories) STORE.pinnedCategories=[];
  const arr = STORE.pinnedCategories;
  const i = arr.indexOf(catKey);
  if(i>-1) arr.splice(i,1); else arr.push(catKey);
  saveStore();
}

/* ==========================================================================
   3. ПОСТРОЕНИЕ КАРТОЧЕК ИЗ RAW-ДАННЫХ
   ========================================================================== */
let APP_DATA = {}; // key -> {meta, cards:[], tasks:[]}

function buildCardFromRaw(catKey, meta, rawRow, fields, idx){
  const id = catKey+"_"+idx;
  const card = { id, catKey };
  fields.forEach((f,i)=>{ card[f]=rawRow[i]; });
  const override = STORE.cardOverrides[id];
  if(override) Object.assign(card, override);
  const saved = STORE.cardProgress[id];
  card.level = saved ? saved.level : 0;
  card.next_review = saved ? saved.next_review : todayISO();
  card.topicId = STORE.cardTopicOverride[id] || defaultTopicIdForIndex(meta, idx);
  return card;
}
function buildExtraCard(catKey, c){
  const saved = STORE.cardProgress[c.id];
  return Object.assign({}, c, {
    level: saved ? saved.level : (c.level||0),
    next_review: saved ? saved.next_review : (c.next_review||todayISO()),
    topicId: STORE.cardTopicOverride[c.id] || c.topicId || "general"
  });
}
function buildAllData(){
  APP_DATA = {};
  CATEGORY_META.forEach(meta=>{
    let cards = meta.raw
      .map((row,idx)=>buildCardFromRaw(meta.key,meta,row,meta.fields,idx))
      .filter(c=>!STORE.deletedCards.includes(c.id));
    const extra = (STORE.extraCards[meta.key]||[]).map(c=>buildExtraCard(meta.key,c));
    cards = cards.concat(extra);
    APP_DATA[meta.key] = { meta, cards, tasks: [] };
  });
  STORE.customCategories.forEach(cc=>{
    const rawCards = STORE.customCards[cc.key] || [];
    const cards = rawCards.map(c=>buildExtraCard(cc.key,c));
    APP_DATA[cc.key] = { meta: cc, cards, tasks: [] };
  });
  allCategoryKeysInternal().forEach(k=>{ APP_DATA[k].tasks = buildTasksForCategory(k); });
}
function allCategoryKeysInternal(){ return Object.keys(APP_DATA); }

/* ==========================================================================
   4. ОТОБРАЖЕНИЕ ЛИЦА КАРТОЧКИ (унифицированная проекция полей)
   ========================================================================== */
function renderCardFace(type,c){
  switch(type){
    case "geo": return {top:c.country, sub:c.capital, body:`${c.fact1}. ${c.fact2}.`, usage:c.usage, connection:`${c.usage}. ${c.fact2}.`};
    case "latin": return {top:c.latin, sub:c.translation, body:c.meaning, usage:c.usage, connection:c.usage};
    case "legal": return {top:c.term, sub:c.translation, body:c.definition, usage:c.example, connection:c.example};
    case "law": return {top:c.term, sub:c.enTerm, body:c.definition, usage:c.example, connection:c.example};
    case "lit": return {top:c.title, sub:c.author, body:c.context, usage:c.legalConn, connection:c.legalConn};
    case "art": return {top:c.work, sub:`${c.artist} · ${c.period}`, body:c.style, usage:c.usage, connection:c.usage};
    case "ita": return {top:c.phrase, sub:c.translation, body:c.grammar, usage:c.usage, connection:c.usage};
    case "lingvo": return {top:c.name, sub:c.sub, body:c.description, usage:c.connection, connection:c.connection};
    case "hist": return {top:c.name, sub:c.sub, body:c.description, usage:c.connection, connection:c.connection};
    default: return {top:c.front||"Карточка", sub:c.back||"", body:c.back||"", usage:c.note||"", connection:c.note||""};

}
function genericPromptVerb(type){

function buildTasksForCategory(catKey){
  const cat = APP_DATA[catKey];
  const cards = cat.cards;
  const type = cat.meta.type || "custom";
  const tasks = [];
  // TASK — множественный выбор
  cards.forEach(c=>{
    const face = renderCardFacePlain(type,c);
    if(!face.sub) return;
    const pool = cards.filter(x=>x.id!==c.id);
    if(pool.length<3) return;
    const distractors = sample(pool,3).map(x=>renderCardFacePlain(type,x).sub);
    const options = shuffle([face.sub, ...distractors]);
    tasks.push({id:uid("t"),cat:catKey,cardId:c.id,topicId:getCardTopicId(catKey,c),mode:"task",
      prompt:`${genericPromptVerb(type)} «${face.top}»?`, options, answer:face.sub,
      explanation:`${face.top} → ${face.sub}. ${face.body}`, olympiad:false});
  });
  // FILL — вставка пропущенного слова
  sample(cards, Math.min(20,cards.length)).forEach(c=>{
    const face = renderCardFacePlain(type,c);
    tasks.push({id:uid("t"),cat:catKey,cardId:c.id,topicId:getCardTopicId(catKey,c),mode:"fill",
      prompt:`Впиши пропущенный термин: ________ — это «${face.sub}». Подсказка: ${(face.body||"").slice(0,80)}`,
      answer:face.top, explanation:`${face.top} — ${face.sub}. ${face.body}`, olympiad:false});
  });
  // MATCH — соответствие
  const matchSets = Math.min(8, Math.floor(cards.length/5) || 0);
  for(let i=0;i<matchSets;i++){
    const picks = sample(cards, Math.min(5,cards.length));
    const pairs = picks.map(c=>{ const f=renderCardFacePlain(type,c); return {left:f.top,right:f.sub,cardId:c.id}; });
    tasks.push({id:uid("t"),cat:catKey,topicId:getCardTopicId(catKey,picks[0]),mode:"match",
      prompt:"Сопоставь термины и их значения", pairs, explanation:"Проверь получившиеся пары.", olympiad:false});
  }
  // OPEN — открытый вопрос
  sample(cards, Math.min(15,cards.length)).forEach(c=>{
    const face = renderCardFacePlain(type,c);
    tasks.push({id:uid("t"),cat:catKey,cardId:c.id,topicId:getCardTopicId(catKey,c),mode:"open",
      prompt:`Своими словами: почему важно «${face.top}» и как это связано с другими темами?`,
      answer:face.connection||face.body, explanation:face.connection||face.body, olympiad:true});
  });
  // CASE — кейсы
  (CASES_BY_CAT[catKey]||[]).forEach(([p,a])=>tasks.push({id:uid("t"),cat:catKey,topicId:"general",mode:"case",
    prompt:p, answer:a, explanation:a, olympiad:true}));
  // Задания, добавленные вручную (вставлены пользователем через "Добавить задания")
  (STORE.customTasks[catKey]||[]).forEach(t=>{
    tasks.push({id:t.id, cat:catKey, cardId:null, topicId:t.topicId||"general", mode:t.mode||"task",
      prompt:t.prompt||"", options:t.options||null, pairs:t.pairs||null,
      answer:t.answer||"", explanation:t.explanation||"", olympiad:!!t.olympiad});
  });
  return tasks;
}

   6. SPACED REPETITION + AURA + РНО (интегрированная логика review)
   ========================================================================== */
function awardAura(amount){ STORE.aura = Math.max(0, (STORE.aura||0) + amount); }
function getLevelInfo(){
  const aura = STORE.aura||0;
  const level = Math.floor(aura/200) + 1;
  const into = aura % 200;
  return { level, aura, into, need:200 };
}
function todayProgress(){
  const d = todayISO();
  if(!STORE.dailyProgress[d]) STORE.dailyProgress[d] = {learned:0,tasks:0,rno:0,bonusGiven:false};
  return STORE.dailyProgress[d];
}

function bumpDaily(kind){
  const p = todayProgress();
  p[kind] = (p[kind]||0)+1;
  checkDailyBonus();
}
function checkDailyBonus(){
  const p = todayProgress();
  if(!p.bonusGiven && p.learned>=STORE.dailyGoals.learned && p.tasks>=STORE.dailyGoals.tasks && p.rno>=STORE.dailyGoals.rno){
    p.bonusGiven = true;
    awardAura(30);
    bumpStreak();
  }
}
function bumpStreak(){
  const today = todayISO();
  const yesterday = addDays(today,-1);
  if(STORE.lastActiveDate===yesterday) STORE.streak = (STORE.streak||0)+1;
  else if(STORE.lastActiveDate!==today) STORE.streak = 1;
  STORE.lastActiveDate = today;
}
function markMistake(cardId){ if(!STORE.mistakeIds.includes(cardId)) STORE.mistakeIds.push(cardId); }
function clearMistakeIfMastered(card){
  if(card.level>=3){
    const i=STORE.mistakeIds.indexOf(card.id);
    if(i>-1){ STORE.mistakeIds.splice(i,1); STORE.fixedMistakes = (STORE.fixedMistakes||0)+1; }
  }
}

function review(card, correct, ctx){
  ctx = ctx || {};
  const today = todayISO();
  if(correct){
    card.level = (card.level||0) + 1;
    const intervals = [1,3,7,14,30];
    const days = intervals[Math.min(card.level, intervals.length-1)];
    card.next_review = addDays(today, days);
    if(card.level>=3){
      if(!STORE.learnLog[today]) STORE.learnLog[today]=[];
      if(!STORE.learnLog[today].includes(card.id)){ STORE.learnLog[today].push(card.id); bumpDaily("learned"); }
      clearMistakeIfMastered(card);
    }
    awardAura(5);
  } else {
    card.level = 0;
    card.next_review = today;
    markMistake(card.id);
    awardAura(1);
  }
  bumpDaily("tasks");
  if(ctx.isRno) bumpDaily("rno");
  STORE.cardProgress[card.id] = { level:card.level, next_review:card.next_review };
  saveStore();
}

function findCard(catKey, cardId){
  if(!cardId || !APP_DATA[catKey]) return null;
  return APP_DATA[catKey].cards.find(c=>c.id===cardId) || null;
}
function allCategoryKeys(){ return Object.keys(APP_DATA); }
function allCards(){ return allCategoryKeys().flatMap(k=>APP_DATA[k].cards); }
function hasProgress(card){ return !!STORE.cardProgress[card.id]; }
function reviewDueCards(){
  return allCards().filter(c=>hasProgress(c) && !STORE.mistakeIds.includes(c.id) && c.next_review<=todayISO());
}
function rnoDueCards(){
  return allCards().filter(c=>STORE.mistakeIds.includes(c.id) && c.next_review<=todayISO());
}

let PLAN_WEEK_OFFSET = 0;

function weekStart(offsetWeeks){
  const d = new Date(todayISO()+"T00:00:00");
  let dow = d.getDay(); dow = dow===0?6:dow-1; // Пн=0
  d.setDate(d.getDate() - dow + offsetWeeks*7);

}
function fmtPlanDate(iso){
  if(iso===todayISO()) return 'сегодня';
  const d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
}
function checkPlanDayBonus(dateIso){
  const dayTasks = STORE.planTasks.filter(t=>t.date===dateIso);
  if(dayTasks.length===0) return;
  if(!dayTasks.every(t=>t.done)) return;
  if(!STORE.dailyProgress[dateIso]) STORE.dailyProgress[dateIso]={};
  if(!STORE.dailyProgress[dateIso].bonusGiven){
    STORE.dailyProgress[dateIso].bonusGiven = true;
    awardAura(30);
    bumpStreak();
  }
}

function renderWeekStrip(){
  const wrap = document.getElementById('weekStrip');

  let html = `<button class="mini-btn" id="weekPrev">‹</button><div class="week-days">`;
  for(let i=0;i<7;i++){
    const iso = addDays(start,i);
    const dp = STORE.dailyProgress[iso];
    const done = dp && dp.bonusGiven;
    const isSel = iso===PLAN_SELECTED_DATE;
    const d = new Date(iso+"T00:00:00");
    html += `<div class="week-day-pick ${isSel?'active':''} ${done?'done':''}" data-date="${iso}">
      <div class="wd-label">${days[i]}</div><div class="wd-num">${d.getDate()}</div>
    </div>`;
  }
  html += `</div><button class="mini-btn" id="weekNext">›</button>`;
  wrap.innerHTML = html;
  document.getElementById('weekPrev').onclick=()=>{ PLAN_WEEK_OFFSET--; renderWeekStrip(); };
  document.getElementById('weekNext').onclick=()=>{ PLAN_WEEK_OFFSET++; renderWeekStrip(); };
  wrap.querySelectorAll('.week-day-pick').forEach(el=>el.onclick=()=>{
    PLAN_SELECTED_DATE = el.dataset.date;
    renderWeekStrip(); renderPlanLists();
  });
}

/* ---------- План: базовый минимум / роскошный максимум + матрица Эйзенхауэра ---------- */
const EIS_QUADS = [
  {id:'uiq', label:'Срочно + Важно', cls:'uiq'},
  {id:'inq', label:'Важно, не срочно', cls:'inq'},
  {id:'uniq', label:'Срочно, не важно', cls:'uniq'},
  {id:'ninq', label:'Не срочно, не важно', cls:'ninq'}
];
function daysUntil(iso){
  if(!iso) return null;
  const diff = Math.ceil((new Date(iso+"T00:00:00") - new Date(todayISO()+"T00:00:00")) / 86400000);
  return diff;
}
function fmtDeadline(iso){
  const d = daysUntil(iso);
  if(d===null) return '';
  if(d<0) return `просрочено на ${Math.abs(d)} дн.`;
  if(d===0) return 'сегодня';
  if(d<31) return `через ${d} дн.`;
  const months = Math.round(d/30.4);
  return `через ~${months} мес.`;
}

/* ---------- Таймер: Pomodoro + Stopwatch ---------- */
let TIMER_MODE = "pomodoro";
let TIMER_STATE = { running:false, seconds:25*60, intervalId:null, subject:"", isBreak:false, stopwatchSeconds:0 };
function renderOvTimer(body){
  body.innerHTML = `
    <div class="timer-tabs">
      <button class="ov-tab ${TIMER_MODE==='pomodoro'?'active':''}" id="tPomodoro">Pomodoro</button>
      <button class="ov-tab ${TIMER_MODE==='stopwatch'?'active':''}" id="tStopwatch">Секундомер</button>
    </div>
    <input class="timer-subject-input" id="timerSubject" placeholder="Над чем работаешь?" value="${esc(TIMER_STATE.subject)}">
    <div class="timer-display-wrap">
      <div class="timer-display" id="timerDisplay">${fmtSeconds2(TIMER_MODE==='pomodoro'?TIMER_STATE.seconds:TIMER_STATE.stopwatchSeconds)}</div>
      ${TIMER_MODE==='pomodoro'?'<div class="pomo-progress"><div class="pomo-progress-fill" id="pomoFill" style="width:0%"></div></div>':''}
    </div>
    <div class="timer-controls">
      <button class="btn btn-timer-primary" id="timerStartPause">${TIMER_STATE.running?'Пауза':'Старт'}</button>
      <button class="btn btn-timer-secondary" id="timerReset">Сброс</button>
      ${TIMER_MODE==='pomodoro'?'<button class="btn btn-timer-ghost" id="pomoSkip">Пропустить</button>':''}
    </div>
    <div class="time-records">
      <h3>Последние записи</h3>
      <div id="recordsList"></div>
    </div>
  `;
  document.getElementById('timerSubject').addEventListener('input',(e)=>{ TIMER_STATE.subject=e.target.value; });
  document.getElementById('tPomodoro').onclick=()=>{ if(TIMER_STATE.running) return; TIMER_MODE='pomodoro'; TIMER_STATE.seconds=25*60; renderOvTimer(body); };
  document.getElementById('tStopwatch').onclick=()=>{ if(TIMER_STATE.running) return; TIMER_MODE='stopwatch'; renderOvTimer(body); };
  document.getElementById('timerStartPause').onclick=()=>toggleTimer(body);
  document.getElementById('timerReset').onclick=()=>resetTimer(body);
  const skip = document.getElementById('pomoSkip');
  if(skip) skip.onclick=()=>{ finishPomodoroSession(body); };
  renderRecordsList();
}
function fmtSeconds2(s){ s=Math.max(0,Math.round(s)); const h=Math.floor(s/3600); const m=Math.floor((s%3600)/60); const r=s%60;
  return h>0? `${h}:${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}` : `${m}:${String(r).padStart(2,'0')}`; }
function toggleTimer(body){
  if(TIMER_STATE.running){
    clearInterval(TIMER_STATE.intervalId); TIMER_STATE.running=false; renderOvTimer(body); return;
  }
  TIMER_STATE.running = true;
  TIMER_STATE.intervalId = setInterval(()=>{
    if(TIMER_MODE==='pomodoro'){
      TIMER_STATE.seconds--;
      const disp = document.getElementById('timerDisplay');
      if(disp) disp.textContent = fmtSeconds2(TIMER_STATE.seconds);
      const totalLen = TIMER_STATE.isBreak?5*60:25*60;
      const fill = document.getElementById('pomoFill');
      if(fill) fill.style.width = Math.round(100*(1-TIMER_STATE.seconds/totalLen))+'%';
      if(TIMER_STATE.seconds<=0) finishPomodoroSession(body);
    } else {
      TIMER_STATE.stopwatchSeconds++;
      const disp = document.getElementById('timerDisplay');
      if(disp) disp.textContent = fmtSeconds2(TIMER_STATE.stopwatchSeconds);
    }
  },1000);
  const btn = document.getElementById('timerStartPause'); if(btn) btn.textContent='Пауза';
}
function finishPomodoroSession(body){
  clearInterval(TIMER_STATE.intervalId); TIMER_STATE.running=false;
  if(!TIMER_STATE.isBreak){
    const dur = 25*60 - Math.max(0,TIMER_STATE.seconds);
    if(dur>10) addTimeRecord(TIMER_STATE.subject||'Без темы', dur, 'pomodoro');
  }
  TIMER_STATE.isBreak = !TIMER_STATE.isBreak;
  TIMER_STATE.seconds = TIMER_STATE.isBreak? 5*60 : 25*60;
  renderOvTimer(body);
}
function resetTimer(body){
  clearInterval(TIMER_STATE.intervalId);
  TIMER_STATE.running=false;
  if(TIMER_MODE==='pomodoro'){
    if(!TIMER_STATE.isBreak){
      const dur = 25*60 - Math.max(0,TIMER_STATE.seconds);
      if(dur>10) addTimeRecord(TIMER_STATE.subject||'Без темы', dur, 'pomodoro');
    }
    TIMER_STATE.seconds=25*60; TIMER_STATE.isBreak=false;
  }
  else {
    if(TIMER_STATE.stopwatchSeconds>10) addTimeRecord(TIMER_STATE.subject||'Без темы', TIMER_STATE.stopwatchSeconds, 'stopwatch');
    TIMER_STATE.stopwatchSeconds=0;
  }
  renderOvTimer(body);
}
function addTimeRecord(subject, seconds, type){
  STORE.timeRecords.push({id:uid('rec'), subject, seconds, date:todayISO(), type});
  saveStore();
}
function renderRecordsList(){
  const list = document.getElementById('recordsList');
  if(!list) return;
  const recent = STORE.timeRecords.slice().reverse().slice(0,15);
  list.innerHTML = recent.length ? recent.map(r=>`
    <div class="time-record-row"><span class="tr-subject">${esc(r.subject)} <span style="color:var(--text-faint);font-size:10px">(${r.type==='pomodoro'?'Pomodoro':'Секундомер'})</span></span><span class="tr-dur">${fmtSeconds2(r.seconds)} · ${fmtDate(r.date)}</span></div>
  `).join('') : `<div style="font-size:12px;color:var(--text-faint)">Записей пока нет</div>`;

/* ---------- Расписание ---------- */
const SCHED_DAYS = ['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
function renderOvSchedule(body){
  let html = `<div class="btn-row" style="margin-bottom:18px">
    <button class="btn btn-primary" id="btnAddSched">+ Добавить пару</button>
    <button class="btn" id="btnImportSched">Импортировать из файла</button>
    <input type="file" id="importSchedFile" accept="application/json" style="display:none">
  </div>
  <div style="font-size:11.5px;color:var(--text-faint);margin-bottom:16px;line-height:1.6">
    Пришли расписание (pdf/docx) мне в чат — я извлеку кабинеты, этажи и преподавателей и соберу файл вида
    <code>{"schedule":[{"day","time","subject","room","professor"}]}</code>, который импортируется сюда одной кнопкой.
  </div>`;
  if(STORE.schedule.length===0){
    html += `<div class="empty-state">Расписание пока пустое.</div>`;
  } else {
    SCHED_DAYS.forEach(day=>{
      const items = STORE.schedule.filter(s=>s.day===day).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
      if(items.length===0) return;
      html += `<div class="sched-day"><div class="sched-day-title">${day}</div>`;
      items.forEach(s=>{
        html += `<div class="sched-item">
          <div class="si-time">${esc(s.time||'')}</div>
          <div><div class="si-main">${esc(s.subject||'')}</div><div class="si-meta">${[s.room?`ауд. ${esc(s.room)}`:'', s.professor?esc(s.professor):''].filter(Boolean).join(' · ')}</div></div>
          <button class="si-del" data-delsched="${s.id}">✕</button>
        </div>`;
      });
      html += `</div>`;
    });
  }
  body.innerHTML = html;
  document.getElementById('btnAddSched').onclick=()=>openScheduleModal(body);
  document.getElementById('btnImportSched').onclick=()=>document.getElementById('importSchedFile').click();
  document.getElementById('importSchedFile').onchange=(e)=>{
    const file = e.target.files[0]; if(file) importScheduleJSON(file, body);
  };
  body.querySelectorAll('[data-delsched]').forEach(b=>b.onclick=()=>{
    STORE.schedule = STORE.schedule.filter(s=>s.id!==b.dataset.delsched);
    saveStore(); renderOvSchedule(body);
  });
}
function openScheduleModal(body){
  document.getElementById('modalBody').innerHTML = `
    <h3>Новая пара</h3>
    <div class="field"><label>День недели</label><select id="schDay">${SCHED_DAYS.map(d=>`<option>${d}</option>`).join('')}</select></div>
    <div class="field"><label>Время</label><input id="schTime" placeholder="09:00–10:30"></div>
    <div class="field"><label>Предмет</label><input id="schSubject"></div>
    <div class="field"><label>Аудитория / этаж</label><input id="schRoom" placeholder="Например: 315, 3 этаж"></div>
    <div class="field"><label>Преподаватель</label><input id="schProf"></div>
    <div class="modal-actions"><button class="btn" id="mCancelSch">Отмена</button><button class="btn btn-primary" id="mSaveSch">Сохранить</button></div>
  `;
  document.getElementById('mCancelSch').onclick=closeOverlay;
  document.getElementById('mSaveSch').onclick=()=>{
    const subject = document.getElementById('schSubject').value.trim();
    if(!subject) return;
    STORE.schedule.push({
      id:uid('sch'), day:document.getElementById('schDay').value, time:document.getElementById('schTime').value.trim(),
      subject, room:document.getElementById('schRoom').value.trim(), professor:document.getElementById('schProf').value.trim()
    });
    saveStore(); closeOverlay(); renderOvSchedule(body);
  };
  openOverlay();
}
function importScheduleJSON(file, body){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      (parsed.schedule||[]).forEach(s=>{
        STORE.schedule.push(Object.assign({id:uid('sch')}, s));
      });
      saveStore(); renderOvSchedule(body);
      openInfoModal('Готово', `Импортировано пар: <b>${(parsed.schedule||[]).length}</b>.`);
    }catch(e){ openInfoModal('Ошибка', 'Не удалось прочитать файл.'); }
  };
  reader.readAsText(file);
}

/* ---------- Календарь (компактный, с навигацией Авг 2026 → Дек 2027) ---------- */
const CAL_MONTHS = (()=>{
  const arr = [];
  const names = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  for(let y=2026;y<=2027;y++){
    for(let m=1;m<=12;m++){
      if(y===2026 && m<8) continue;
      arr.push({y,m,name:`${names[m-1]} ${y}`});
    }
  }
  return arr;
})();
let CAL_MONTH_IDX = 0;
function renderCalendarInto(wrap){
  const {y,m,name} = CAL_MONTHS[CAL_MONTH_IDX];
  let html = `<div class="btn-row" style="align-items:center;margin-bottom:4px">
    <button class="mini-btn" id="calPrev" ${CAL_MONTH_IDX===0?'disabled':''}>‹</button>
    <span class="cal-month-title" style="margin:0">${name}</span>
    <button class="mini-btn" id="calNext" ${CAL_MONTH_IDX===CAL_MONTHS.length-1?'disabled':''}>›</button>
  </div><div class="cal-grid">`;
  ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(d=>html+=`<div class="cal-dow">${d}</div>`);
  const first = new Date(y,m-1,1);
  let startDow = first.getDay(); startDow = startDow===0?6:startDow-1;
  for(let i=0;i<startDow;i++) html += '<div class="cal-cell empty"></div>';
  const daysInMonth = new Date(y,m,0).getDate();
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dp = STORE.dailyProgress[iso];
    const filled = !!(dp && dp.bonusGiven);
    html += `<div class="cal-cell ${filled?'filled':''}" data-date="${iso}"><span class="n">${d}</span></div>`;
  }
  html += '</div>';
  wrap.innerHTML = html;
  document.getElementById('calPrev').onclick=()=>{ if(CAL_MONTH_IDX>0){ CAL_MONTH_IDX--; renderCalendarInto(wrap); } };
  document.getElementById('calNext').onclick=()=>{ if(CAL_MONTH_IDX<CAL_MONTHS.length-1){ CAL_MONTH_IDX++; renderCalendarInto(wrap); } };
  wrap.querySelectorAll('.cal-cell[data-date]').forEach(cell=>{
    cell.onclick=()=>{
      const iso = cell.dataset.date;
      const ids = STORE.learnLog[iso]||[];
      const dp = STORE.dailyProgress[iso];
      const planDone = dp && dp.bonusGiven ? 'План дня выполнен.' : 'План дня не был выполнен полностью.';
      const names = ids.map(id=>{
        const c = allCards().find(x=>x.id===id);
        if(!c) return id;
        const face = renderCardFacePlain((APP_DATA[c.catKey]||{}).meta ? APP_DATA[c.catKey].meta.type : "custom", c);
        return face.top;
      });
      openInfoModal(`${fmtDate(iso)}`, `${planDone}<br><br>` + (names.length? names.map(n=>`• ${esc(n)}`).join('<br>') : 'Карточки в этот день не выучивались.'));
    };
  });
}

function donutSVG(pct){
  const r=26, c=2*Math.PI*r, off=c*(1-pct/100);
  return `<svg width="64" height="64" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="${r}" fill="none" style="stroke:var(--border)" stroke-width="7"/>
    <circle cx="32" cy="32" r="${r}" fill="none" style="stroke:var(--khaki-ring)" stroke-width="7" stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round" transform="rotate(-90 32 32)"/>
    <text x="32" y="37" text-anchor="middle" font-size="14" style="fill:var(--text)" font-family="Montserrat">${pct}%</text>
  </svg>`;
}

/* ---------- Перетаскивание тем пальцем/мышью вместо стрелочек ---------- */
function initTopicDrag(container, key, onCommit){
  if(!container) return;
  let dragEl = null, dragId = null, startY = 0, startTop = 0, rows = [];

  function rowsInfo(){
    return [...container.querySelectorAll('.topic-row')].map(el=>({el, id:el.dataset.id, rect:el.getBoundingClientRect()}));
  }
  container.querySelectorAll('[data-drag]').forEach(handle=>{
    handle.addEventListener('pointerdown',(e)=>{
      dragEl = handle.closest('.topic-row');
      dragId = handle.dataset.drag;
      startY = e.clientY;
      startTop = dragEl.offsetTop;
      rows = rowsInfo();
      dragEl.classList.add('dragging');
      dragEl.style.zIndex = 5;
      try{ handle.setPointerCapture(e.pointerId); }catch(err){}
    });
    handle.addEventListener('pointermove',(e)=>{
      if(!dragEl) return;
      const delta = e.clientY - startY;
      dragEl.style.transform = `translateY(${delta}px)`;
      dragEl.style.position = 'relative';
      const dragCenter = startTop + delta + dragEl.offsetHeight/2;
      const others = rows.filter(r=>r.id!==dragId);
      let targetIndex = others.length;
      for(let i=0;i<others.length;i++){
        const rowMidOffset = others[i].el.offsetTop + others[i].el.offsetHeight/2;
        if(dragCenter < rowMidOffset){ targetIndex = i; break; }
      }
      const currentOrder = [...container.querySelectorAll('.topic-row')].map(el=>el.dataset.id);
      const withoutDrag = currentOrder.filter(id=>id!==dragId);
      withoutDrag.splice(targetIndex, 0, dragId);
      if(withoutDrag.join(',') !== currentOrder.join(',')){
        withoutDrag.forEach(id=>{
          if(id===dragId) return;
          const el = container.querySelector(`.topic-row[data-id="${id}"]`);
          if(el) container.insertBefore(el, null);
        });
        // переставляем DOM в новом порядке (кроме перетаскиваемого, который визуально смещён transform'ом)
        const orderedEls = withoutDrag.map(id=>container.querySelector(`.topic-row[data-id="${id}"]`)).filter(Boolean);
        orderedEls.forEach(el=>container.appendChild(el));
        rows = rowsInfo();
      }
    });
    const end = (e)=>{
      if(!dragEl) return;
      dragEl.classList.remove('dragging');
      dragEl.style.transform = '';
      dragEl.style.position = '';
      dragEl.style.zIndex = '';
      const finalOrder = [...container.querySelectorAll('.topic-row')].map(el=>el.dataset.id);
      STORE.topicOrder[key] = finalOrder;
      saveStore();
      dragEl = null; dragId = null;
      onCommit();
    };
    handle.addEventListener('pointerup', end);
    handle.addEventListener('pointercancel', end);
  });
}

    saveStore();
    NOTEBOOK_STATE = { catKey:key, notebookId:nb.id, tool:'pen', color:NB_COLORS[0], width:NB_TOOL_DEFAULTS.pen.width, opacity:NB_TOOL_DEFAULTS.pen.opacity, redoStacks:{}, newPageBg:'lined', newPagePaper:'cream', zoom:1 };
    renderNotebookTab(body,key);
  };
  body.querySelectorAll('[data-open-nb]').forEach(el=>el.addEventListener('click',(e)=>{
    if(e.target.closest('[data-del-nb]')) return;
    NOTEBOOK_STATE = { catKey:key, notebookId:el.dataset.openNb, tool:'pen', color:NB_COLORS[0], width:NB_TOOL_DEFAULTS.pen.width, opacity:NB_TOOL_DEFAULTS.pen.opacity, redoStacks:{}, newPageBg:'lined', newPagePaper:'cream', zoom:1 };
    renderNotebookTab(body,key);
  }));
  body.querySelectorAll('[data-del-nb]').forEach(el=>el.addEventListener('click',(e)=>{
    e.stopPropagation();
    if(!confirm('Точно удалить тетрадь целиком, со всеми страницами? Это безвозвратно.')) return;
    STORE.notebooks[key] = (STORE.notebooks[key]||[]).filter(n=>n.id!==el.dataset.delNb);
    saveStore();
    renderNotebookTab(body,key);
  }));
}

        </select>

          <option value="white" ${s.newPagePaper==='white'?'selected':''}>Белый</option>

  document.getElementById('nbBack').onclick=()=>{ NOTEBOOK_STATE=null; renderNotebookTab(body,key); };

  document.getElementById('nbToolPen').onclick=()=>{ setTool('pen'); };
  document.getElementById('nbToolPencil').onclick=()=>{ setTool('pencil'); };
  document.getElementById('nbToolHi').onclick=()=>{ setTool('highlighter'); };
  document.getElementById('nbToolEraser').onclick=()=>{ setTool('eraser'); };
  function setTool(tool){
    s.tool = tool;
    if(NB_TOOL_DEFAULTS[tool]){ s.width = NB_TOOL_DEFAULTS[tool].width; s.opacity = NB_TOOL_DEFAULTS[tool].opacity; }

  document.querySelectorAll('.nb-swatch').forEach(sw=>sw.onclick=()=>{

    canvas.className = 'nb-canvas';
    const liveCanvas = document.createElement('canvas');
    liveCanvas.className = 'nb-canvas-live';
    pageDiv.appendChild(canvas);
    pageDiv.appendChild(liveCanvas);
